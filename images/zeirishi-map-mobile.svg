<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" width="360" height="760" role="img" aria-labelledby="title desc"><title id="title">税理士試験の5科目構成と選択条件</title><desc id="desc">会計学2科目と税法3科目。所得税法・法人税法の少なくとも一方を含み、消費税法と酒税法、住民税と事業税は各組の一方のみ。</desc><style>text{font-family:"Noto Sans JP","Hiragino Sans",sans-serif}</style><rect x="0" y="0" width="360" height="760" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="180.0" y="30" font-size="12.5" fill="#1E293B" text-anchor="middle" font-weight="700">税理士試験：会計学2科目＋税法3科目</text>
<text x="180.0" y="52" font-size="10" fill="#1E293B" text-anchor="middle">税法の組合せには条件があります</text>
<rect x="16" y="76" width="328" height="114" rx="10" fill="#DBEAFE" stroke="#CBD5E1"/>
<text x="30" y="105" font-size="14" fill="#1E293B" text-anchor="start" font-weight="700">会計学：必須2科目</text>
<text x="30" y="137" font-size="13" fill="#1E293B" text-anchor="start">簿記論・財務諸表論</text>
<text x="30" y="166" font-size="11" fill="#1E293B" text-anchor="start">1科目ずつ受験することも可能</text>
<rect x="16" y="208" width="328" height="186" rx="10" fill="#EDE9FE" stroke="#CBD5E1"/>
<text x="30" y="238" font-size="14" fill="#1E293B" text-anchor="start" font-weight="700">税法：9科目から3科目</text>
<text x="30" y="268" font-size="11" fill="#1E293B" text-anchor="start">所得税法・法人税法・相続税法</text>
<text x="30" y="291" font-size="11" fill="#1E293B" text-anchor="start">消費税法・酒税法・国税徴収法</text>
<text x="30" y="314" font-size="11" fill="#1E293B" text-anchor="start">住民税・事業税・固定資産税</text>
<text x="30" y="337" font-size="11" fill="#1E293B" text-anchor="start">所得税法・法人税法の少なくとも</text>
<text x="30" y="360" font-size="11" fill="#1E293B" text-anchor="start">一方を含める（両方の選択も可能）</text>
<rect x="16" y="412" width="328" height="158" rx="10" fill="#FEF3C7" stroke="#CBD5E1"/>
<text x="30" y="442" font-size="14" fill="#1E293B" text-anchor="start" font-weight="700">同時に選べない組合せ</text>
<text x="30" y="474" font-size="11.5" fill="#1E293B" text-anchor="start">消費税法 と 酒税法：一方のみ</text>
<text x="30" y="503" font-size="11.5" fill="#1E293B" text-anchor="start">住民税 と 事業税：一方のみ</text>
<text x="30" y="543" font-size="10.5" fill="#1E293B" text-anchor="start">「残りは自由に2科目」ではありません</text>
<rect x="16" y="588" width="328" height="148" rx="10" fill="#DCFCE7" stroke="#CBD5E1"/>
<text x="30" y="617" font-size="13" fill="#1E293B" text-anchor="start" font-weight="700">条件を満たす組合せの例</text>
<text x="30" y="647" font-size="11" fill="#1E293B" text-anchor="start">簿記論・財務諸表論・法人税法</text>
<text x="30" y="673" font-size="11" fill="#1E293B" text-anchor="start">消費税法・国税徴収法</text>
<text x="30" y="711" font-size="9.5" fill="#1E293B" text-anchor="start">出典：国税庁／2026年10月31日確認</text></svg>
