<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">受験計画｜日程・年度・時間を分ける</title><desc id="desc">01 統一日と受付を区別：第175回：2027年2月28日、地域の受付・定員を別に確認。02 ネット試験の休止を確認：2月22日〜3月3日は施行休止、空席や期限も確認して予約。03 自分の予定時間を計算：週405分×使える11週、4,455分＝74時間15分の計画例</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">受験計画｜日程・年度・時間を分ける</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">01 統一日と受付を区別</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">第175回：2027年2月28日</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">地域の受付・定員を別に確認</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">02 ネット試験の休止を確認</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">2月22日〜3月3日は施行休止</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">空席や期限も確認して予約</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">03 自分の予定時間を計算</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">週405分×使える11週</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">4,455分＝74時間15分の計画例</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
