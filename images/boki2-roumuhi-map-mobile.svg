<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">労務費｜手取と要支払額を分ける</title><desc id="desc">01 支払った総額へ戻す：手取460,000＋控除40,000、給与総額500,000円。02 当月分の要支払額に直す：前月未払40,000を除く、当月未払60,000を加える。03 当月労務費は520,000円：500,000−40,000＋60,000、この例は全額が工場労務費</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">労務費｜手取と要支払額を分ける</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">01 支払った総額へ戻す</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">手取460,000＋控除40,000</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">給与総額500,000円</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">02 当月分の要支払額に直す</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">前月未払40,000を除く</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">当月未払60,000を加える</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">03 当月労務費は520,000円</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">500,000−40,000＋60,000</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">この例は全額が工場労務費</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
