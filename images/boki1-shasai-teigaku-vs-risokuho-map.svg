<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">社債｜2年間を満期まで検算</title><desc id="desc">01  自作例の条件：額面100,000円・発行96,228円・2年、現金利払2,000円、実効利子率4％。02  費用と現金利払を分ける：定額法の利息費用：毎年3,886円、利息法：1年目3,849・2年目3,923円。03  端数処理も含めてつなぐ：費用合計は両方法とも7,772円、最終の社債残高は両方法とも100,000円</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">社債｜2年間を満期まで検算</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">01  自作例の条件</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">額面100,000円・発行96,228円・2年</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">現金利払2,000円、実効利子率4％</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">02  費用と現金利払を分ける</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">定額法の利息費用：毎年3,886円</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">利息法：1年目3,849・2年目3,923円</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">03  端数処理も含めてつなぐ</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">費用合計は両方法とも7,772円</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">最終の社債残高は両方法とも100,000円</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
