<title id="title">決算整理｜利益と残高をつなぐ</title><desc id="desc">01 損益を計算：売上600,000／売上原価330,000、給料・償却・引当・税を控除。02 利益剰余金へつなぐ：利益78,000円／配当等なし、期首410,000＋78,000＝488,000円。03 貸借合計を検算：資産898,000＝負債110,000、＋純資産788,000円</desc>
