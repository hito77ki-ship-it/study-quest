<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">材料費｜用途・購入・消費を分ける</title><desc id="desc">01  用途と費目の指定を確認：主要材料・買入部品→直接材料費、補助材料・工場消耗品等→間接材料費。02  材料副費は購入原価の論点：引取運賃等と、その他の副費を区別、算入・予定配賦・例外を問題文で確認。03  自作例を、数量と金額で検算：FIFO：消費2,820＋残780＝3,600円、総平均：消費2,880＋残720＝3,600円</desc>
<rect width="760" height="560" rx="18" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">材料費｜用途・購入・消費を分ける</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">01  用途と費目の指定を確認</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">主要材料・買入部品→直接材料費</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">補助材料・工場消耗品等→間接材料費</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">02  材料副費は購入原価の論点</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">引取運賃等と、その他の副費を区別</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">算入・予定配賦・例外を問題文で確認</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">03  自作例を、数量と金額で検算</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">FIFO：消費2,820＋残780＝3,600円</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">総平均：消費2,880＋残720＝3,600円</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
