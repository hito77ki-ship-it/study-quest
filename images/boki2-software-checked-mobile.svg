<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">ソフトウェア｜使用開始を確認</title><desc id="desc">01 購入800,000円・5年の例：10月から使用なら6か月、当期償却80,000円。02 購入日と使用開始が別なら：10月取得・1月使用開始の仮定、3か月の償却40,000円。03 費用の性質も分ける：必要な設定と研修は別、5年以内は原則と根拠を区別</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">ソフトウェア｜使用開始を確認</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">01 購入800,000円・5年の例</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">10月から使用なら6か月</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">当期償却80,000円</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">02 購入日と使用開始が別なら</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">10月取得・1月使用開始の仮定</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">3か月の償却40,000円</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">03 費用の性質も分ける</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">必要な設定と研修は別</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">5年以内は原則と根拠を区別</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
