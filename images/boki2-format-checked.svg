<title id="title">方式の選択｜予定と操作で比べる</title><desc id="desc">01 同等の資格と試験枠組み：範囲・難易度・合格基準は同じ、方式で合格しやすさを断定しない。02 会場・空席・期限を照合：11月9日〜18日は休止、希望日を必ず選べるわけではない。03 入力と下書きを試す：ネットは配布用紙とボールペン、自分の演習結果から判断</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">方式の選択｜予定と操作で比べる</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">01 同等の資格と試験枠組み</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">範囲・難易度・合格基準は同じ</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">方式で合格しやすさを断定しない</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">02 会場・空席・期限を照合</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">11月9日〜18日は休止</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">希望日を必ず選べるわけではない</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">03 入力と下書きを試す</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">ネットは配布用紙とボールペン</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">自分の演習結果から判断</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
