<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">CVP分析：150個・300,000円の損益分岐点</title>
<desc id="desc">編集部の自作例。販売単価2,000円、単位変動費1,200円、固定費120,000円。売上高と総費用が150個・300,000円で一致し、250個で利益80,000円となる。</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/>
<rect x="10" y="100" width="740" height="350" rx="12" fill="#1E3023"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif">
<text x="32" y="45" font-size="25" text-anchor="start" fill="#B6E27C">CVP｜自作例の損益分岐点</text>
<text x="32" y="73" font-size="12" text-anchor="start" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<text x="32" y="125" font-size="12" text-anchor="start" fill="#C7D3C7">金額（千円）</text>
<line id="grid-120" x1="80" y1="338" x2="700" y2="338" stroke="#507448" stroke-width="1" stroke-dasharray="3 4"/>
<text x="72" y="342" font-size="11" text-anchor="end" fill="#C7D3C7">120</text>
<line id="grid-300" x1="80" y1="260" x2="700" y2="260" stroke="#507448" stroke-width="1" stroke-dasharray="3 4"/>
<text x="72" y="264" font-size="11" text-anchor="end" fill="#C7D3C7">300</text>
<line id="grid-600" x1="80" y1="130" x2="700" y2="130" stroke="#507448" stroke-width="1" stroke-dasharray="3 4"/>
<text x="72" y="134" font-size="11" text-anchor="end" fill="#C7D3C7">600</text>
<line id="axis-y" x1="80" y1="390" x2="80" y2="130" stroke="#C7D3C7" stroke-width="2"/>
<line id="axis-x" x1="80" y1="390" x2="700" y2="390" stroke="#C7D3C7" stroke-width="2"/>
<line id="revenue-line" x1="80" y1="390" x2="700" y2="130" stroke="#B6E27C" stroke-width="3"/>
<line id="cost-line" x1="80" y1="338" x2="700" y2="182" stroke="#8FD3F4" stroke-width="3"/>
<line id="fixed-line" x1="80" y1="338" x2="700" y2="338" stroke="#D8B987" stroke-width="2" stroke-dasharray="6 4"/>
<line id="bep-guide" x1="390" y1="260" x2="390" y2="390" stroke="#B6E27C" stroke-width="1.5" stroke-dasharray="4 4"/>
<circle id="break-even" cx="390" cy="260" r="5" fill="#B6E27C"/>
<text x="80" y="408" font-size="11" text-anchor="middle" fill="#C7D3C7">0</text>
<text x="390" y="408" font-size="11" text-anchor="middle" fill="#C7D3C7">150</text>
<text x="700" y="408" font-size="11" text-anchor="middle" fill="#C7D3C7">300</text>
<text x="380" y="430" font-size="12" text-anchor="middle" fill="#C7D3C7">販売数量（個）</text>
<text x="625" y="122" font-size="13" text-anchor="start" fill="#B6E27C">売上高</text>
<text x="625" y="174" font-size="13" text-anchor="start" fill="#8FD3F4">総費用</text>
<text x="625" y="329" font-size="12" text-anchor="start" fill="#D8B987">固定費</text>
<text x="210" y="225" font-size="12" text-anchor="start" fill="#B6E27C">150個／300千円</text>
<rect x="10" y="465" width="740" height="80" rx="12" fill="#101B13"/>
<text x="32" y="493" font-size="16" text-anchor="start" fill="#F0F6ED">単価2,000円・単位変動費1,200円・固定費120,000円</text>
<text x="32" y="521" font-size="16" text-anchor="start" fill="#F0F6ED">150個で売上＝総費用＝300,000円。250個で営業利益80,000円。</text>
</g></svg>
