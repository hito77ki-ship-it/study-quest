<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 580" width="780" height="580" role="img" aria-labelledby="title desc">
<title id="title">TOEFL iBTの総合・技能別条件の架空例</title><desc id="desc">各技能4.0以上という架空の出願条件。5.0、5.0、3.5、4.0の平均は4.375、総合は4.5。Speakingは仮の条件未満。</desc>
<style>text{font-family:'Noto Sans JP','Hiragino Sans',sans-serif}</style>
<rect x="0" y="0" width="780" height="580" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="390.0" y="30" font-size="19" fill="#1E293B" text-anchor="middle" font-weight="700">TOEFL iBT：総合と技能別の条件</text>
<text x="390.0" y="52" font-size="13" fill="#1E293B" text-anchor="middle">現行1〜6尺度／出願条件は提出先が指定</text>
<text x="390.0" y="85" font-size="14" fill="#1E293B" text-anchor="middle" font-weight="700">架空例：出願先が各技能4.0以上を指定した場合</text>
<line x1="70" y1="430" x2="730" y2="430" stroke="#CBD5E1" stroke-dasharray="5,4"/>
<text x="60" y="434" font-size="12" fill="#1E293B" text-anchor="end">1.0</text>
<line x1="70" y1="318" x2="730" y2="318" stroke="#CBD5E1" stroke-dasharray="5,4"/>
<text x="60" y="322" font-size="12" fill="#1E293B" text-anchor="end">3.0</text>
<line x1="70" y1="262" x2="730" y2="262" stroke="#EF4444" stroke-dasharray="5,4"/>
<text x="60" y="266" font-size="12" fill="#1E293B" text-anchor="end">4.0</text>
<line x1="70" y1="150" x2="730" y2="150" stroke="#CBD5E1" stroke-dasharray="5,4"/>
<text x="60" y="154" font-size="12" fill="#1E293B" text-anchor="end">6.0</text>
<text x="720" y="122" font-size="11" fill="#B91C1C" text-anchor="end">仮の条件4.0以上</text>
<rect x="125" y="206.0" width="90" height="224.0" rx="10" fill="#93C5FD" stroke="#CBD5E1"/>
<text x="170" y="194.0" font-size="16" fill="#1E293B" text-anchor="middle" font-weight="700">5.0</text>
<text x="170" y="457" font-size="14" fill="#1E293B" text-anchor="middle" font-weight="700">Reading</text>
<rect x="295" y="206.0" width="90" height="224.0" rx="10" fill="#86EFAC" stroke="#CBD5E1"/>
<text x="340" y="194.0" font-size="16" fill="#1E293B" text-anchor="middle" font-weight="700">5.0</text>
<text x="340" y="457" font-size="14" fill="#1E293B" text-anchor="middle" font-weight="700">Listening</text>
<rect x="465" y="290.0" width="90" height="140.0" rx="10" fill="#FCA5A5" stroke="#CBD5E1"/>
<text x="510" y="278.0" font-size="16" fill="#1E293B" text-anchor="middle" font-weight="700">3.5</text>
<text x="510" y="457" font-size="14" fill="#1E293B" text-anchor="middle" font-weight="700">Speaking</text>
<rect x="635" y="262.0" width="90" height="168.0" rx="10" fill="#C4B5FD" stroke="#CBD5E1"/>
<text x="680" y="250.0" font-size="16" fill="#1E293B" text-anchor="middle" font-weight="700">4.0</text>
<text x="680" y="457" font-size="14" fill="#1E293B" text-anchor="middle" font-weight="700">Writing</text>
<text x="390.0" y="482" font-size="12" fill="#1E293B" text-anchor="middle">縦軸は1.0から。各技能と総合は0.5刻み。</text>
<rect x="30" y="500" width="720" height="60" rx="10" fill="#FEF3C7" stroke="#CBD5E1"/>
<text x="390.0" y="524" font-size="13" fill="#1E293B" text-anchor="middle" font-weight="700">平均4.375 → 総合4.5。でもSpeaking 3.5は仮の条件4.0未満。</text>
<text x="390.0" y="546" font-size="12" fill="#1E293B" text-anchor="middle">ETS共通の合格点はない。出願先の指定を確認する。</text>
<text x="390.0" y="576" font-size="9" fill="#1E293B" text-anchor="middle">出典：ETS「Understanding Your Scores」／2026年10月31日確認</text>
</svg>
