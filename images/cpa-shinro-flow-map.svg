<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="title desc">
  <title id="title">公認会計士を諦めた後の4つの選択肢で確認すること</title>
  <desc id="desc">簿記1級、税理士、就職・転職、別分野の各候補について、公式情報、求人票、自分の記録を照合する確認先マップ。</desc>
  <defs>
    <style>
      text { font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif; }
      .heading { fill: #475569; font-size: 18px; font-weight: 700; }
      .sub { fill: #64748B; font-size: 12px; }
      .card-title { fill: #475569; font-size: 15px; font-weight: 700; }
      .card-copy { fill: #64748B; font-size: 12px; }
      .label { fill: #64748B; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
    </style>
  </defs>

  <text x="400" y="34" text-anchor="middle" class="heading">会計士試験をやめた後、候補ごとに確認すること</text>
  <text x="400" y="56" text-anchor="middle" class="sub">どれが正解かを決めず、公開情報と自分の記録を照合する</text>

  <rect x="245" y="88" width="310" height="76" rx="14" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <text x="400" y="119" text-anchor="middle" class="card-title">確認する材料を分ける</text>
  <text x="400" y="143" text-anchor="middle" class="sub">公式の制度条件・求人票や仕事内容・自分の記録と固定予定</text>

  <path d="M400 164 V202 M400 202 H170 M400 202 H630" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <path d="M170 202 V226 M630 202 V226 M400 202 V356" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>

  <rect x="45" y="226" width="250" height="112" rx="14" fill="none" stroke="#65A30D" stroke-width="2.5"/>
  <text x="70" y="253" class="label">CHOICE 01</text>
  <text x="70" y="282" class="card-title">簿記1級</text>
  <text x="70" y="307" class="card-copy">公式の科目・合格基準</text>
  <text x="70" y="327" class="card-copy">自分の演習記録</text>

  <rect x="505" y="226" width="250" height="112" rx="14" fill="none" stroke="#0F766E" stroke-width="2.5"/>
  <text x="530" y="253" class="label">CHOICE 02</text>
  <text x="530" y="282" class="card-title">税理士</text>
  <text x="530" y="307" class="card-copy">会計・税法科目の受験資格</text>
  <text x="530" y="327" class="card-copy">次に確認する科目の条件</text>

  <rect x="45" y="356" width="250" height="112" rx="14" fill="none" stroke="#2563EB" stroke-width="2.5"/>
  <text x="70" y="383" class="label">CHOICE 03</text>
  <text x="70" y="412" class="card-title">就職・転職</text>
  <text x="70" y="437" class="card-copy">求人票の必須・歓迎条件</text>
  <text x="70" y="457" class="card-copy">事実として説明できる経験</text>

  <rect x="505" y="356" width="250" height="112" rx="14" fill="none" stroke="#C2410C" stroke-width="2.5"/>
  <text x="530" y="383" class="label">CHOICE 04</text>
  <text x="530" y="412" class="card-title">別分野</text>
  <text x="530" y="437" class="card-copy">仕事内容・学び直しの条件</text>
  <text x="530" y="457" class="card-copy">生活上の予定との両立</text>

  <path d="M170 338 V492 H630 V468 M630 338 V492" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <text x="400" y="522" text-anchor="middle" class="sub">確認した内容を記録してから、次に調べることを一つ選ぶ</text>
</svg>
