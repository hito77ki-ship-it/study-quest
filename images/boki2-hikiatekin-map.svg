<title id="title">引当金｜費用・残高・支払元を分ける</title><desc id="desc">01 貸倒の必要額と繰入額：必要20,000円 − 既存8,000円、差額補充で繰入12,000円。02 退職給付の残高を検算：700,000＋150,000−300,000−50,000、期末の負債500,000円。03 年金資産からの給付は別：債務と年金資産が同額減少、会社の預金からの支払と分ける</desc>
