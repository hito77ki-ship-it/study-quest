<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">引当金｜費用・残高・支払元を分ける</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">01 貸倒の必要額と繰入額</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">必要20,000円 − 既存8,000円</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">差額補充で繰入12,000円</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">02 退職給付の残高を検算</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">700,000＋150,000−300,000−50,000</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">期末の負債500,000円</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">03 年金資産からの給付は別</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">債務と年金資産が同額減少</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">会社の預金からの支払と分ける</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
