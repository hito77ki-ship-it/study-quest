<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">外貨換算｜直前の残高と比較</title><desc id="desc">01  自作例：売掛金1,000ドル：取引時140円→売掛金140,000円、年末143円→売掛金143,000円。02  翌期の回収は145円：入金145,000−帳簿143,000、翌期の為替差益は2,000円。03  2期間の損益を検算：前期3,000＋翌期2,000＝5,000円、円受取145,000−当初140,000と一致</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">外貨換算｜直前の残高と比較</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="13" font-weight="700" fill="#B6E27C">01  自作例：売掛金1,000ドル</text>
<text x="34" y="165" font-size="12" fill="#F0F6ED">取引時140円→売掛金140,000円</text>
<text x="34" y="193" font-size="12" fill="#F0F6ED">年末143円→売掛金143,000円</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="13" font-weight="700" fill="#B6E27C">02  翌期の回収は145円</text>
<text x="34" y="339" font-size="12" fill="#F0F6ED">入金145,000−帳簿143,000</text>
<text x="34" y="367" font-size="12" fill="#F0F6ED">翌期の為替差益は2,000円</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="13" font-weight="700" fill="#B6E27C">03  2期間の損益を検算</text>
<text x="34" y="513" font-size="12" fill="#F0F6ED">前期3,000＋翌期2,000＝5,000円</text>
<text x="34" y="541" font-size="12" fill="#F0F6ED">円受取145,000−当初140,000と一致</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
