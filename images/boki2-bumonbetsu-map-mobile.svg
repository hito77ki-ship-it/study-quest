<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">部門別計算｜同じ費用・違う分母</title><desc id="desc">01  相互配賦を一律2段階としない：本文は2段階の簡便な方法を指定、純粋の相互配賦等とは区別する。02  比率を変えた自作例：修繕60,000円・動力40,000円、直接：切削55,000円・組立45,000円。03  2段階の結果と検算：切削53,000円・組立47,000円、合計100,000円でも、負担額は変わる</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">部門別計算｜同じ費用・違う分母</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="13" font-weight="700" fill="#B6E27C">01  相互配賦を一律2段階としない</text>
<text x="34" y="165" font-size="12" fill="#F0F6ED">本文は2段階の簡便な方法を指定</text>
<text x="34" y="193" font-size="12" fill="#F0F6ED">純粋の相互配賦等とは区別する</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="13" font-weight="700" fill="#B6E27C">02  比率を変えた自作例</text>
<text x="34" y="339" font-size="12" fill="#F0F6ED">修繕60,000円・動力40,000円</text>
<text x="34" y="367" font-size="12" fill="#F0F6ED">直接：切削55,000円・組立45,000円</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="13" font-weight="700" fill="#B6E27C">03  2段階の結果と検算</text>
<text x="34" y="513" font-size="12" fill="#F0F6ED">切削53,000円・組立47,000円</text>
<text x="34" y="541" font-size="12" fill="#F0F6ED">合計100,000円でも、負担額は変わる</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
