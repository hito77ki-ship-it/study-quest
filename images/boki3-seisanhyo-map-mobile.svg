<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 490" width="360" height="490" role="img"><title>8桁精算表をつくる順番</title><style>text{font-family:system-ui,-apple-system,sans-serif}</style>
<text x="20" y="30" fill="#739b4b" font-size="19" font-weight="700">8桁精算表をつくる順番</text>
<rect x="16" y="55" width="328" height="98" rx="8" fill="#14211d" stroke="#739b4b" stroke-width="1.5"/>
<text x="30" y="83" fill="#bddb91" font-size="15" font-weight="700">1　残高と修正</text>
<text x="30" y="105" fill="#c6d7c9" font-size="13">試算表の残高を確認</text>
<text x="30" y="125" fill="#c6d7c9" font-size="13">決算整理仕訳を作る</text>
<text x="30" y="145" fill="#c6d7c9" font-size="13">借方・貸方を修正欄へ</text>
<text x="180.0" y="169" fill="#739b4b" font-size="18">↓</text>
<rect x="16" y="173" width="328" height="98" rx="8" fill="#14211d" stroke="#739b4b" stroke-width="1.5"/>
<text x="30" y="201" fill="#bddb91" font-size="15" font-weight="700">2　科目で振り分け</text>
<text x="30" y="223" fill="#c6d7c9" font-size="13">費用・収益 → P/L</text>
<text x="30" y="243" fill="#c6d7c9" font-size="13">資産・負債・純資産 → B/S</text>
<text x="30" y="263" fill="#c6d7c9" font-size="13">資産の控除項目も区別</text>
<text x="180.0" y="287" fill="#739b4b" font-size="18">↓</text>
<rect x="16" y="291" width="328" height="98" rx="8" fill="#14211d" stroke="#739b4b" stroke-width="1.5"/>
<text x="30" y="319" fill="#bddb91" font-size="15" font-weight="700">3　差額と条件を照合</text>
<text x="30" y="341" fill="#c6d7c9" font-size="13">利益：P/L借方・B/S貸方</text>
<text x="30" y="361" fill="#c6d7c9" font-size="13">損失：P/L貸方・B/S借方</text>
<text x="30" y="381" fill="#c6d7c9" font-size="13">元の条件にも戻って確認</text>
<rect x="12" y="414" width="336" height="64" rx="8" fill="#14211d"/><text x="18" y="440" fill="#c6d7c9" font-size="11">貸倒引当金・累計額は資産の控除項目。</text>
<text x="18" y="461" fill="#c6d7c9" font-size="11">合計の一致だけで正解とは判断しません。</text></svg>
