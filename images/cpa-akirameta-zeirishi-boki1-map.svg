<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="svgtitle svgdesc">
  <title id="svgtitle">税理士の簿記論・財務諸表論と日商簿記1級の受験条件比較</title>
  <desc id="svgdesc">税理士試験の簿記論・財務諸表論と日商簿記1級について、受験資格、試験形式、税法科目との関係を比較する図解</desc>
  <defs>
    <linearGradient id="zbBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFC"/>
      <stop offset="1" stop-color="#F0FFF4"/>
    </linearGradient>
    <linearGradient id="zbTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#2D4A10"/>
    </linearGradient>
    <linearGradient id="zbHigh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8CC63F"/>
      <stop offset="1" stop-color="#6AAF2B"/>
    </linearGradient>
    <linearGradient id="zbMid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="zbShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1E293B" flood-opacity="0.10"/>
    </filter>
    <style>.zt{font-family:"Noto Sans JP",system-ui,sans-serif}</style>
  </defs>

  <rect width="1200" height="660" rx="20" fill="url(#zbBg)"/>

  <!-- Title -->
  <rect x="40" y="24" width="1120" height="64" rx="14" fill="url(#zbTitle)"/>
  <text x="600" y="48" text-anchor="middle" class="zt" font-size="11.5" font-weight="700" fill="#A0C070" letter-spacing="2">受験資格と試験形式の比較</text>
  <text x="600" y="71" text-anchor="middle" class="zt" font-size="19" font-weight="800" fill="#FFFFFF">税理士（簿財）と簿記1級、先に確認する条件</text>

  <!-- Hub card -->
  <g filter="url(#zbShadow)">
    <rect x="380" y="110" width="440" height="92" rx="16" fill="#FFFFFF" stroke="#8CC63F" stroke-width="2"/>
  </g>
  <text x="600" y="140" text-anchor="middle" class="zt" font-size="15" font-weight="800" fill="#1A202C">最初に分けて確認すること</text>
  <text x="600" y="162" text-anchor="middle" class="zt" font-size="12" fill="#374151">簿財だけを受けるか／税法科目まで進むか</text>
  <text x="600" y="182" text-anchor="middle" class="zt" font-size="11" font-weight="700" fill="#6AAF2B">↓ 条件が違う2つの試験を比べる</text>

  <!-- Connector lines -->
  <line x1="500" y1="202" x2="310" y2="250" stroke="#CBD5E1" stroke-width="2.5"/>
  <line x1="700" y1="202" x2="890" y2="250" stroke="#CBD5E1" stroke-width="2.5"/>

  <!-- Left card: 税理士 簿記論・財務諸表論 -->
  <g filter="url(#zbShadow)">
    <rect x="60" y="250" width="500" height="230" rx="16" fill="#FDF2F8" stroke="#F472B6" stroke-width="2"/>
  </g>
  <rect x="60" y="250" width="500" height="40" rx="16" fill="#F472B6"/>
  <rect x="60" y="274" width="500" height="16" fill="#F472B6"/>
  <text x="310" y="276" text-anchor="middle" class="zt" font-size="14" font-weight="800" fill="#FFFFFF">📘 税理士 簿記論・財務諸表論</text>

  <text x="90" y="308" class="zt" font-size="11.5" font-weight="700" fill="#9D174D">確認する受験条件</text>
  <text x="90" y="330" class="zt" font-size="12.5" fill="#374151">簿記論・財務諸表論の受験資格：制限なし</text>
  <text x="90" y="354" class="zt" font-size="12" fill="#374151">この2科目だけなら資格証明書は不要</text>
  <text x="90" y="386" class="zt" font-size="11.5" font-weight="700" fill="#9D174D">税理士試験での位置づけ</text>
  <text x="90" y="408" class="zt" font-size="12" fill="#374151">会計学2科目。科目合格制で一度に5科目不要</text>
  <text x="90" y="430" class="zt" font-size="12" fill="#374151">税法科目を受けるときは別の要件を確認</text>

  <rect x="90" y="442" width="440" height="28" rx="14" fill="#9D174D"/>
  <text x="310" y="461" text-anchor="middle" class="zt" font-size="12" font-weight="700" fill="#fff">まず受けたい科目と公式日程を確認</text>

  <!-- Right card: 日商簿記1級 -->
  <g filter="url(#zbShadow)">
    <rect x="640" y="250" width="500" height="230" rx="16" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <rect x="640" y="250" width="500" height="40" rx="16" fill="#3B82F6"/>
  <rect x="640" y="274" width="500" height="16" fill="#3B82F6"/>
  <text x="890" y="276" text-anchor="middle" class="zt" font-size="14" font-weight="800" fill="#FFFFFF">📗 日商簿記1級（商業簿記・会計学／工業簿記・原価計算）</text>

  <text x="670" y="304" class="zt" font-size="11.5" font-weight="700" fill="#1E40AF">試験形式</text>
  <text x="670" y="328" class="zt" font-size="12.5" fill="#374151">商業簿記・会計学／工業簿記・原価計算</text>
  <text x="670" y="352" class="zt" font-size="12" fill="#374151">各90分の2つの時間帯を通して受験</text>
  <text x="670" y="386" class="zt" font-size="11.5" font-weight="700" fill="#1E40AF">合格基準・日程</text>
  <text x="670" y="408" class="zt" font-size="12" fill="#374151">総点70%以上、かつ各科目40%以上</text>
  <text x="670" y="430" class="zt" font-size="12" fill="#374151">2026年度統一試験：6月14日・11月15日</text>

  <rect x="670" y="442" width="440" height="28" rx="14" fill="#1E40AF"/>
  <text x="890" y="461" text-anchor="middle" class="zt" font-size="12" font-weight="700" fill="#fff">税法科目の資格要件を満たす方法の一つ</text>

  <!-- Bottom summary bar -->
  <rect x="40" y="510" width="1120" height="110" rx="16" fill="#111827" filter="url(#zbShadow)"/>
  <text x="600" y="542" text-anchor="middle" class="zt" font-size="14" font-weight="700" fill="#8CC63F">選択前の確認順</text>
  <text x="600" y="568" text-anchor="middle" class="zt" font-size="12" fill="#E5E7EB">① 簿財だけを受ける → 受験資格は不要。税法科目の要件と混同しない</text>
  <text x="600" y="592" text-anchor="middle" class="zt" font-size="12" fill="#E5E7EB">② 税法まで進む → 自分の要件を確認。日商簿記1級は満たす方法の一つ</text>
</svg>
