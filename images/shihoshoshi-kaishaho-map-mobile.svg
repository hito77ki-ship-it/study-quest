<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">会社法｜代表・任期・決議の条件</title><desc id="desc">01  代表：互選には定款の根拠：取締役会非設置：349条3項を確認、代表者等を定めなければ各自代表が原則。02  任期：非公開だけでは10年にできない：監査等委員会・指名委員会等は伸長対象外、終期は事業年度と定時総会終結で確認。03  決議：議決権で計算する：出席120個：過半数は61個以上、3分の2以上なら80個以上（自作例）</desc>
<rect width="390" height="660" rx="18" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">会社法｜代表・任期・決議の条件</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="14" font-weight="700" fill="#B6E27C">01  代表：互選には定款の根拠</text>
<text x="34" y="165" font-size="13" fill="#F0F6ED">取締役会非設置：349条3項を確認</text>
<text x="34" y="193" font-size="13" fill="#F0F6ED">代表者等を定めなければ各自代表が原則</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="14" font-weight="700" fill="#B6E27C">02  任期：非公開だけでは10年にできない</text>
<text x="34" y="339" font-size="13" fill="#F0F6ED">監査等委員会・指名委員会等は伸長対象外</text>
<text x="34" y="367" font-size="13" fill="#F0F6ED">終期は事業年度と定時総会終結で確認</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="14" font-weight="700" fill="#B6E27C">03  決議：議決権で計算する</text>
<text x="34" y="513" font-size="13" fill="#F0F6ED">出席120個：過半数は61個以上</text>
<text x="34" y="541" font-size="13" fill="#F0F6ED">3分の2以上なら80個以上（自作例）</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件の詳細・一次資料・自作例題の解答は本文へ</text></g></svg>
