<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">簿記1級｜講座と独学の判断シート</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="13" font-weight="700" fill="#B6E27C">01  受験回と教材の年度</text>
<text x="34" y="165" font-size="12" fill="#F0F6ED">配信開始日・演習の提供日・受講期限</text>
<text x="34" y="193" font-size="12" fill="#F0F6ED">受験する回に必要な教材がそろうか</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="13" font-weight="700" fill="#B6E27C">02  質問の解消先を具体的に</text>
<text x="34" y="339" font-size="12" fill="#F0F6ED">対象・回数・返答方法を確認する</text>
<text x="34" y="367" font-size="12" fill="#F0F6ED">講義やAIだけで正解を保証しない</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="13" font-weight="700" fill="#B6E27C">03  受講料と必要な予算を分ける</text>
<text x="34" y="513" font-size="12" fill="#F0F6ED">紙・追加教材・受験料・交通費も確認</text>
<text x="34" y="541" font-size="12" fill="#F0F6ED">教育訓練給付は条件付きの事後支給</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
