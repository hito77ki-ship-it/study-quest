<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1050" width="360" height="1050" role="img" aria-labelledby="title desc">
<title id="title">TOEIC L&amp;Rの問題数と学習案</title><desc id="desc">国内公開テストはListening100問、Reading100問。学習案は公式の採用基準・CEFR換算ではない。</desc>
<style>text{font-family:'Noto Sans JP','Hiragino Sans',sans-serif}</style>
<rect x="0" y="0" width="360" height="1050" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="180.0" y="34" font-size="16" fill="#1E293B" text-anchor="middle" font-weight="700">TOEIC L&amp;R 公開テストの全体像</text>
<text x="180.0" y="58" font-size="11" fill="#1E293B" text-anchor="middle">問題数の内訳と編集部の学習案</text>
<rect x="16" y="78" width="328" height="180" rx="10" fill="#DBEAFE" stroke="#93C5FD"/>
<text x="30" y="105" font-size="14" fill="#1E293B" text-anchor="start" font-weight="700">Listening：100問・約45分</text>
<text x="30" y="135" font-size="12" fill="#1E293B" text-anchor="start">Part 1 写真描写：6問</text>
<text x="30" y="161" font-size="12" fill="#1E293B" text-anchor="start">Part 2 応答：25問</text>
<text x="30" y="187" font-size="12" fill="#1E293B" text-anchor="start">Part 3 会話：39問</text>
<text x="30" y="213" font-size="12" fill="#1E293B" text-anchor="start">Part 4 説明文：30問</text>
<rect x="16" y="274" width="328" height="155" rx="10" fill="#FEF3C7" stroke="#FCD34D"/>
<text x="30" y="301" font-size="14" fill="#1E293B" text-anchor="start" font-weight="700">Reading：100問・75分</text>
<text x="30" y="331" font-size="12" fill="#1E293B" text-anchor="start">Part 5 短文穴埋め：30問</text>
<text x="30" y="357" font-size="12" fill="#1E293B" text-anchor="start">Part 6 長文穴埋め：16問</text>
<text x="30" y="383" font-size="12" fill="#1E293B" text-anchor="start">Part 7 読解：54問</text>
<text x="180.0" y="454" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="700">計200問・約2時間／合計10〜990点</text>
<text x="180.0" y="475" font-size="11" fill="#1E293B" text-anchor="middle">問題数の比率を配点と同一視しない</text>
<text x="180.0" y="518" font-size="13" fill="#1E293B" text-anchor="middle" font-weight="700">スコア帯別の学習案（編集部の提案）</text>
<rect x="16" y="540" width="328" height="116" rx="10" fill="#DBEAFE" stroke="#CBD5E1"/>
<text x="30" y="570" font-size="13" fill="#1E293B" text-anchor="start" font-weight="700">〜600点：基礎の確認</text>
<text x="30" y="598" font-size="11.5" fill="#1E293B" text-anchor="start">誤答から語彙・文法の課題を探す</text>
<text x="30" y="622" font-size="11.5" fill="#1E293B" text-anchor="start">意味と文の構造を確認する</text>
<rect x="16" y="674" width="328" height="116" rx="10" fill="#FEF3C7" stroke="#CBD5E1"/>
<text x="30" y="704" font-size="13" fill="#1E293B" text-anchor="start" font-weight="700">600〜800点：パート別の見直し</text>
<text x="30" y="732" font-size="11.5" fill="#1E293B" text-anchor="start">音声とスクリプトを照合する</text>
<text x="30" y="756" font-size="11.5" fill="#1E293B" text-anchor="start">読解の根拠と時間切れを記録する</text>
<rect x="16" y="808" width="328" height="116" rx="10" fill="#DCFCE7" stroke="#CBD5E1"/>
<text x="30" y="838" font-size="13" fill="#1E293B" text-anchor="start" font-weight="700">800点〜：正確さと時間管理</text>
<text x="30" y="866" font-size="11.5" fill="#1E293B" text-anchor="start">言い換えや文書のつながりを確認</text>
<text x="30" y="890" font-size="11.5" fill="#1E293B" text-anchor="start">読む速さだけでなく誤答原因を見る</text>
<text x="180.0" y="965" font-size="10.5" fill="#1E293B" text-anchor="middle">区分はCEFR換算・採用基準ではありません</text>
<text x="180.0" y="986" font-size="10.5" fill="#1E293B" text-anchor="middle">点数だけで弱点を決めず、自分の記録で調整</text>
<text x="180.0" y="1022" font-size="9.5" fill="#1E293B" text-anchor="middle">出典：IIBCの試験形式／2026年10月31日確認</text>
</svg>
