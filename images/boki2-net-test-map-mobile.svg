<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">ネット試験｜予約と入力を分ける</title><desc id="desc">01 申込経路を選ぶ：ネット申込か会場問い合わせか、ネット申込は税込合計6,050円。02 休止期間と空席を確認：11月9日〜18日は施行休止、3日後なら必ず受験可とは限らない。03 数字のみで入力する：120,000円という答えの例、金額欄は120000。円記号を付けない</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">ネット試験｜予約と入力を分ける</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">01 申込経路を選ぶ</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">ネット申込か会場問い合わせか</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">ネット申込は税込合計6,050円</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">02 休止期間と空席を確認</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">11月9日〜18日は施行休止</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">3日後なら必ず受験可とは限らない</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">03 数字のみで入力する</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">120,000円という答えの例</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">金額欄は120000。円記号を付けない</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
