<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">復習判断｜配点を決めつけない</title><desc id="desc">01 公式の枠組みを確認：5題以内・90分・70%以上、連結の毎回の配点は断定しない。02 実際の誤答を分ける：持分割合・取得日・計算・転記、どこで止まったかを記録。03 未確認の範囲を残す：基礎だけで取れる点は保証しない、次の練習を演習結果から選ぶ</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">復習判断｜配点を決めつけない</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">01 公式の枠組みを確認</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">5題以内・90分・70%以上</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">連結の毎回の配点は断定しない</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">02 実際の誤答を分ける</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">持分割合・取得日・計算・転記</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">どこで止まったかを記録</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">03 未確認の範囲を残す</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">基礎だけで取れる点は保証しない</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">次の練習を演習結果から選ぶ</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
