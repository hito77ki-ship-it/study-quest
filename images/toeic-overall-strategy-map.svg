<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-labelledby="title desc">
<title id="title">TOEIC L&amp;Rの問題数と学習案</title><desc id="desc">国内公開テストはListening100問、Reading100問。学習案は公式の採用基準・CEFR換算ではない。</desc>
<style>text{font-family:'Noto Sans JP','Hiragino Sans',sans-serif}</style>
<rect x="0" y="0" width="1200" height="860" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="600.0" y="34" font-size="24" fill="#1E293B" text-anchor="middle" font-weight="700">TOEIC L&amp;R 公開テストの全体像</text>
<text x="600.0" y="58" font-size="15" fill="#1E293B" text-anchor="middle">問題数の内訳と編集部の学習案</text>
<rect x="40" y="90" width="540" height="170" rx="10" fill="#DBEAFE" stroke="#CBD5E1"/>
<text x="64" y="128" font-size="20" fill="#1E293B" text-anchor="start" font-weight="700">Listening：100問・約45分</text>
<text x="64" y="170" font-size="15" fill="#1E293B" text-anchor="start">Part 1 写真描写 6問 ／ Part 2 応答 25問</text>
<text x="64" y="205" font-size="15" fill="#1E293B" text-anchor="start">Part 3 会話 39問 ／ Part 4 説明文 30問</text>
<rect x="620" y="90" width="540" height="170" rx="10" fill="#FEF3C7" stroke="#CBD5E1"/>
<text x="644" y="128" font-size="20" fill="#1E293B" text-anchor="start" font-weight="700">Reading：100問・75分</text>
<text x="644" y="170" font-size="15" fill="#1E293B" text-anchor="start">Part 5 短文穴埋め 30問 ／ Part 6 長文穴埋め 16問</text>
<text x="644" y="205" font-size="15" fill="#1E293B" text-anchor="start">Part 7 読解 54問（1文書29問・複数文書25問）</text>
<text x="600.0" y="300" font-size="18" fill="#1E293B" text-anchor="middle" font-weight="700">計200問・約2時間。各技能5〜495点、合計10〜990点。</text>
<text x="600.0" y="330" font-size="15" fill="#1E293B" text-anchor="middle">問題数の内訳であり、問題ごとの配点を表す図ではありません。</text>
<text x="600.0" y="405" font-size="21" fill="#1E293B" text-anchor="middle" font-weight="700">スコア帯別の学習案（編集部の提案）</text>
<rect x="40" y="440" width="340" height="260" rx="10" fill="#DBEAFE" stroke="#CBD5E1"/>
<text x="210" y="480" font-size="18" fill="#1E293B" text-anchor="middle" font-weight="700">〜600点：基礎の確認</text>
<text x="64" y="540" font-size="14" fill="#1E293B" text-anchor="start">誤答から語彙・文法の課題を探す</text>
<text x="64" y="586" font-size="14" fill="#1E293B" text-anchor="start">文の意味と構造を確認する</text>
<text x="64" y="632" font-size="14" fill="#1E293B" text-anchor="start">問題形式の練習も組み合わせる</text>
<rect x="430" y="440" width="340" height="260" rx="10" fill="#FEF3C7" stroke="#CBD5E1"/>
<text x="600" y="480" font-size="18" fill="#1E293B" text-anchor="middle" font-weight="700">600〜800点：パート別</text>
<text x="454" y="540" font-size="14" fill="#1E293B" text-anchor="start">音声とスクリプトを照合する</text>
<text x="454" y="586" font-size="14" fill="#1E293B" text-anchor="start">読解の根拠を本文で確認する</text>
<text x="454" y="632" font-size="14" fill="#1E293B" text-anchor="start">時間切れと理解の誤りを分ける</text>
<rect x="820" y="440" width="340" height="260" rx="10" fill="#DCFCE7" stroke="#CBD5E1"/>
<text x="990" y="480" font-size="18" fill="#1E293B" text-anchor="middle" font-weight="700">800点〜：正確さと時間</text>
<text x="844" y="540" font-size="14" fill="#1E293B" text-anchor="start">言い換えや文書の関係を確認</text>
<text x="844" y="586" font-size="14" fill="#1E293B" text-anchor="start">読む速さだけを追わない</text>
<text x="844" y="632" font-size="14" fill="#1E293B" text-anchor="start">練習記録から優先順位を調整</text>
<text x="600.0" y="746" font-size="16" fill="#1E293B" text-anchor="middle">区分はCEFR換算や企業共通の採用基準ではありません。</text>
<text x="600.0" y="778" font-size="16" fill="#1E293B" text-anchor="middle">スコアだけで弱点を決めず、解答と時間の記録で練習を選びます。</text>
<text x="600.0" y="827" font-size="12" fill="#1E293B" text-anchor="middle">出典：IIBC「テストの形式と構成」／2026年10月31日確認</text>
</svg>
