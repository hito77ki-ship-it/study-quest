<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img"><title>8桁精算表をつくる順番</title><style>text{font-family:system-ui,-apple-system,sans-serif}</style>
<text x="20" y="30" fill="#739b4b" font-size="19" font-weight="700">8桁精算表をつくる順番</text>
<rect x="20" y="65" width="230" height="160" rx="8" fill="#14211d" stroke="#739b4b" stroke-width="1.5"/>
<text x="34" y="93" fill="#bddb91" font-size="15" font-weight="700">1　残高と修正</text>
<text x="34" y="118" fill="#c6d7c9" font-size="13">試算表の残高を確認</text>
<text x="34" y="141" fill="#c6d7c9" font-size="13">決算整理仕訳を作る</text>
<text x="34" y="164" fill="#c6d7c9" font-size="13">借方・貸方を修正欄へ</text>
<text x="253" y="150" fill="#739b4b" font-size="18">→</text>
<rect x="266" y="65" width="230" height="160" rx="8" fill="#14211d" stroke="#739b4b" stroke-width="1.5"/>
<text x="280" y="93" fill="#bddb91" font-size="15" font-weight="700">2　科目で振り分け</text>
<text x="280" y="118" fill="#c6d7c9" font-size="13">費用・収益 → P/L</text>
<text x="280" y="141" fill="#c6d7c9" font-size="13">資産・負債・純資産 → B/S</text>
<text x="280" y="164" fill="#c6d7c9" font-size="13">資産の控除項目も区別</text>
<text x="499" y="150" fill="#739b4b" font-size="18">→</text>
<rect x="512" y="65" width="230" height="160" rx="8" fill="#14211d" stroke="#739b4b" stroke-width="1.5"/>
<text x="526" y="93" fill="#bddb91" font-size="15" font-weight="700">3　差額と条件を照合</text>
<text x="526" y="118" fill="#c6d7c9" font-size="13">利益：P/L借方・B/S貸方</text>
<text x="526" y="141" fill="#c6d7c9" font-size="13">損失：P/L貸方・B/S借方</text>
<text x="526" y="164" fill="#c6d7c9" font-size="13">元の条件にも戻って確認</text>
<rect x="12" y="242" width="736" height="70" rx="8" fill="#14211d"/><text x="18" y="265" fill="#c6d7c9" font-size="13">貸倒引当金・減価償却累計額は、負債ではなく資産の控除項目。</text>
<text x="18" y="287" fill="#c6d7c9" font-size="13">合計の一致だけでは、科目の誤りや記帳漏れを検出できない場合があります。</text></svg>
