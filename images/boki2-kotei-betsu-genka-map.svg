<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">01 第1工程で分ける</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">投入1,350,000円のうち</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">次工程1,200,000／仕掛品150,000</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">02 第2工程でも分ける</text>
