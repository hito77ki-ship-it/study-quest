<title id="title">工程別原価｜二つの仕掛品を残す</title><desc id="desc">01 第1工程で分ける：投入1,350,000円のうち、次工程1,200,000／仕掛品150,000。02 第2工程でも分ける：加工費550,000円を追加、完成1,500,000／仕掛品250,000。03 全体で二重集計しない：150,000＋250,000＋1,500,000、＝総投入原価1,900,000円</desc>
