<title id="title">のれん｜把握と配分を見直す</title><desc id="desc">01 対価60円・配分純額70円：資産120−負債50＝70円、負ののれん10円と見込まれる。02 負債20円の見落としを確認：負債合計70円に修正、配分純額120−70＝50円。03 差額の向きが変わる：対価60−純額50＝のれん10円、見直す前の利益10円を確定しない</desc>
