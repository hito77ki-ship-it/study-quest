<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">CVP分析：150個・300,000円の損益分岐点</title>
<desc id="desc">編集部の自作例。販売単価2,000円、単位変動費1,200円、固定費120,000円。売上高と総費用が150個・300,000円で一致し、250個で利益80,000円となる。</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/>
<rect x="10" y="100" width="370" height="350" rx="12" fill="#1E3023"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif">
<text x="20" y="45" font-size="17" text-anchor="start" fill="#B6E27C">CVP｜自作例の損益分岐点</text>
<text x="20" y="73" font-size="12" text-anchor="start" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<text x="25" y="125" font-size="12" text-anchor="start" fill="#C7D3C7">金額（千円）</text>
<line id="grid-120" x1="55" y1="348" x2="355" y2="348" stroke="#507448" stroke-width="1" stroke-dasharray="3 4"/>
<text x="47" y="352" font-size="11" text-anchor="end" fill="#C7D3C7">120</text>
<line id="grid-300" x1="55" y1="270" x2="355" y2="270" stroke="#507448" stroke-width="1" stroke-dasharray="3 4"/>
<text x="47" y="274" font-size="11" text-anchor="end" fill="#C7D3C7">300</text>
<line id="grid-600" x1="55" y1="140" x2="355" y2="140" stroke="#507448" stroke-width="1" stroke-dasharray="3 4"/>
<text x="47" y="144" font-size="11" text-anchor="end" fill="#C7D3C7">600</text>
<line id="axis-y" x1="55" y1="400" x2="55" y2="140" stroke="#C7D3C7" stroke-width="2"/>
<line id="axis-x" x1="55" y1="400" x2="355" y2="400" stroke="#C7D3C7" stroke-width="2"/>
<line id="revenue-line" x1="55" y1="400" x2="355" y2="140" stroke="#B6E27C" stroke-width="3"/>
<line id="cost-line" x1="55" y1="348" x2="355" y2="192" stroke="#8FD3F4" stroke-width="3"/>
<line id="fixed-line" x1="55" y1="348" x2="355" y2="348" stroke="#D8B987" stroke-width="2" stroke-dasharray="6 4"/>
<line id="bep-guide" x1="205" y1="270" x2="205" y2="400" stroke="#B6E27C" stroke-width="1.5" stroke-dasharray="4 4"/>
<circle id="break-even" cx="205" cy="270" r="5" fill="#B6E27C"/>
<text x="55" y="418" font-size="11" text-anchor="middle" fill="#C7D3C7">0</text>
<text x="205" y="418" font-size="11" text-anchor="middle" fill="#C7D3C7">150</text>
<text x="355" y="418" font-size="11" text-anchor="middle" fill="#C7D3C7">300</text>
<text x="195" y="440" font-size="12" text-anchor="middle" fill="#C7D3C7">販売数量（個）</text>
<text x="280" y="132" font-size="13" text-anchor="start" fill="#B6E27C">売上高</text>
<text x="280" y="184" font-size="13" text-anchor="start" fill="#8FD3F4">総費用</text>
<text x="280" y="339" font-size="12" text-anchor="start" fill="#D8B987">固定費</text>
<text x="75" y="235" font-size="12" text-anchor="start" fill="#B6E27C">150個／300千円</text>
<rect x="10" y="465" width="370" height="140" rx="12" fill="#101B13"/>
<text x="24" y="493" font-size="12" text-anchor="start" fill="#F0F6ED">単価2,000円・単位変動費1,200円</text>
<text x="24" y="522" font-size="12" text-anchor="start" fill="#F0F6ED">固定費120,000円・貢献利益800円/個</text>
<text x="24" y="551" font-size="12" text-anchor="start" fill="#F0F6ED">150個で売上＝総費用＝300,000円</text>
<text x="24" y="580" font-size="12" text-anchor="start" fill="#F0F6ED">250個で営業利益80,000円</text>
<rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<text x="20" y="639" font-size="11" text-anchor="start" fill="#C7D3C7">分析範囲では単価・単位変動費・固定費一定</text>
</g></svg>
