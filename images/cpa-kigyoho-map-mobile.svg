<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">機関設計｜委員会型を先に分ける</title><desc id="desc">01  二つの委員会型か？：監査等委員会 ／ 指名委員会等、取締役会・会計監査人が必要、監査役禁止。02  両委員会型を除く公開大会社：取締役会＋監査役会＋会計監査人、328条1項の除外条件を落とさない。03  さらに機関の連動を確認：会計監査人→監査役（委員会型を除く）、非公開の会計参与：327条2項ただし書</desc>
<rect width="390" height="660" rx="18" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">機関設計｜委員会型を先に分ける</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="14" font-weight="700" fill="#B6E27C">01  二つの委員会型か？</text>
<text x="34" y="165" font-size="13" fill="#F0F6ED">監査等委員会 ／ 指名委員会等</text>
<text x="34" y="193" font-size="13" fill="#F0F6ED">取締役会・会計監査人が必要、監査役禁止</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="14" font-weight="700" fill="#B6E27C">02  両委員会型を除く公開大会社</text>
<text x="34" y="339" font-size="13" fill="#F0F6ED">取締役会＋監査役会＋会計監査人</text>
<text x="34" y="367" font-size="13" fill="#F0F6ED">328条1項の除外条件を落とさない</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="14" font-weight="700" fill="#B6E27C">03  さらに機関の連動を確認</text>
<text x="34" y="513" font-size="13" fill="#F0F6ED">会計監査人→監査役（委員会型を除く）</text>
<text x="34" y="541" font-size="13" fill="#F0F6ED">非公開の会計参与：327条2項ただし書</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件の詳細・一次資料・自作例題の解答は本文へ</text></g></svg>
