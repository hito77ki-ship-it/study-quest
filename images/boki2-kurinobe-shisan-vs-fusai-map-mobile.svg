<title id="title">税効果｜現金と期間配分を分ける</title><desc id="desc">01 1期目の一時差異100,000：当期税額180,000−調整30,000、税金費用150,000／資産30,000。02 翌期に差異が解消：当期税額120,000＋調整30,000、税金費用150,000／資産残高0。03 2期合計で確認：当期税額300,000／調整合計0、資産計上の仕訳で現金は動かない</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">税効果｜現金と期間配分を分ける</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">01 1期目の一時差異100,000</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">当期税額180,000−調整30,000</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">税金費用150,000／資産30,000</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">02 翌期に差異が解消</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">当期税額120,000＋調整30,000</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">税金費用150,000／資産残高0</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">03 2期合計で確認</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">当期税額300,000／調整合計0</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">資産計上の仕訳で現金は動かない</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
