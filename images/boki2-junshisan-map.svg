<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">配当｜科目内の振替と社外への支払</title><desc id="desc">01 資本金1,000,000円の例：配当100,000円、基準額250,000円、準備金の不足枠と10,000円を比較。02 準備金合計で変わる積立額：200,000→10,000／248,000→2,000、260,000→0円（負の積立ではない）。03 積立10,000円のとき：繰越利益−110,000／利益準備金＋10,000、純資産合計−100,000円、預金は後日支払</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">配当｜科目内の振替と社外への支払</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">01 資本金1,000,000円の例</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">配当100,000円、基準額250,000円</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">準備金の不足枠と10,000円を比較</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">02 準備金合計で変わる積立額</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">200,000→10,000／248,000→2,000</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">260,000→0円（負の積立ではない）</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">03 積立10,000円のとき</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">繰越利益−110,000／利益準備金＋10,000</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">純資産合計−100,000円、預金は後日支払</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
