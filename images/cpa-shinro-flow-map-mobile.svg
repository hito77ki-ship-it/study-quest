<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 930" width="360" height="930" role="img" aria-labelledby="title desc">
  <title id="title">公認会計士を諦めた後の4つの選択肢で確認すること</title>
  <desc id="desc">簿記1級、税理士、就職・転職、別分野の各候補について、公式情報、求人票、自分の記録を照合する確認先マップ。</desc>
  <defs>
    <style>
      text { font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif; }
      .heading { fill: #475569; font-size: 15px; font-weight: 700; }
      .sub { fill: #64748B; font-size: 10.5px; }
      .card-title { fill: #475569; font-size: 14px; font-weight: 700; }
      .card-copy { fill: #64748B; font-size: 11px; }
      .label { fill: #64748B; font-size: 9.5px; font-weight: 700; letter-spacing: .8px; }
    </style>
  </defs>

  <text x="180" y="32" text-anchor="middle" class="heading">会計士試験をやめた後、</text>
  <text x="180" y="53" text-anchor="middle" class="heading">候補ごとに確認すること</text>
  <text x="180" y="76" text-anchor="middle" class="sub">結論を急がず、公開情報と自分の記録を照合する</text>

  <rect x="28" y="105" width="304" height="94" rx="14" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <text x="180" y="137" text-anchor="middle" class="card-title">確認する材料を分ける</text>
  <text x="180" y="161" text-anchor="middle" class="sub">公式の制度条件・求人票や仕事内容</text>
  <text x="180" y="179" text-anchor="middle" class="sub">自分の記録と固定予定</text>
  <path d="M180 199 V225" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>

  <rect x="28" y="225" width="304" height="126" rx="14" fill="none" stroke="#65A30D" stroke-width="2.5"/>
  <text x="54" y="252" class="label">CHOICE 01</text>
  <text x="54" y="282" class="card-title">簿記1級</text>
  <text x="54" y="309" class="card-copy">公式の科目・合格基準</text>
  <text x="54" y="329" class="card-copy">自分の演習記録</text>

  <path d="M180 351 V377" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <rect x="28" y="377" width="304" height="126" rx="14" fill="none" stroke="#0F766E" stroke-width="2.5"/>
  <text x="54" y="404" class="label">CHOICE 02</text>
  <text x="54" y="434" class="card-title">税理士</text>
  <text x="54" y="461" class="card-copy">会計・税法科目の受験資格</text>
  <text x="54" y="481" class="card-copy">次に確認する科目の条件</text>

  <path d="M180 503 V529" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <rect x="28" y="529" width="304" height="126" rx="14" fill="none" stroke="#2563EB" stroke-width="2.5"/>
  <text x="54" y="556" class="label">CHOICE 03</text>
  <text x="54" y="586" class="card-title">就職・転職</text>
  <text x="54" y="613" class="card-copy">求人票の必須・歓迎条件</text>
  <text x="54" y="633" class="card-copy">事実として説明できる経験</text>

  <path d="M180 655 V681" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <rect x="28" y="681" width="304" height="126" rx="14" fill="none" stroke="#C2410C" stroke-width="2.5"/>
  <text x="54" y="708" class="label">CHOICE 04</text>
  <text x="54" y="738" class="card-title">別分野</text>
  <text x="54" y="765" class="card-copy">仕事内容・学び直しの条件</text>
  <text x="54" y="785" class="card-copy">生活上の予定との両立</text>

  <text x="180" y="857" text-anchor="middle" class="sub">確認した内容を記録してから、</text>
  <text x="180" y="877" text-anchor="middle" class="sub">次に調べることを一つ選ぶ</text>
</svg>
