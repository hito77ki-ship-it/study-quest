<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 920" width="360" height="920" role="img" aria-labelledby="title desc"><title id="title">中小企業診断士の1次配点と科目免除</title><desc id="desc">各科目100点。免除科目は合否判定の対象外で、受験した科目の総点数と各科目の基準で判定する。</desc><style>text{font-family:"Noto Sans JP","Hiragino Sans",sans-serif}</style><rect x="0" y="0" width="360" height="920" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="180.0" y="30" font-size="13" fill="#1E293B" text-anchor="middle" font-weight="700">中小企業診断士：1次試験の配点</text>
<text x="180.0" y="56" font-size="10" fill="#1E293B" text-anchor="middle">勉強時間のグラフではありません</text>
<rect x="16" y="80" width="328" height="66" rx="10" fill="#DBEAFE" stroke="#CBD5E1"/>
<text x="28" y="107" font-size="11" fill="#1E293B" text-anchor="start" font-weight="700">経済学・経済政策</text>
<text x="332" y="131" font-size="12" fill="#1E293B" text-anchor="end" font-weight="700">100点</text>
<rect x="16" y="160" width="328" height="66" rx="10" fill="#DCFCE7" stroke="#CBD5E1"/>
<text x="28" y="187" font-size="11" fill="#1E293B" text-anchor="start" font-weight="700">財務・会計</text>
<text x="332" y="211" font-size="12" fill="#1E293B" text-anchor="end" font-weight="700">100点</text>
<rect x="16" y="240" width="328" height="66" rx="10" fill="#DBEAFE" stroke="#CBD5E1"/>
<text x="28" y="267" font-size="11" fill="#1E293B" text-anchor="start" font-weight="700">企業経営理論</text>
<text x="332" y="291" font-size="12" fill="#1E293B" text-anchor="end" font-weight="700">100点</text>
<rect x="16" y="320" width="328" height="66" rx="10" fill="#DCFCE7" stroke="#CBD5E1"/>
<text x="28" y="347" font-size="11" fill="#1E293B" text-anchor="start" font-weight="700">運営管理</text>
<text x="332" y="371" font-size="12" fill="#1E293B" text-anchor="end" font-weight="700">100点</text>
<rect x="16" y="400" width="328" height="66" rx="10" fill="#DBEAFE" stroke="#CBD5E1"/>
<text x="28" y="427" font-size="11" fill="#1E293B" text-anchor="start" font-weight="700">経営法務</text>
<text x="332" y="451" font-size="12" fill="#1E293B" text-anchor="end" font-weight="700">100点</text>
<rect x="16" y="480" width="328" height="66" rx="10" fill="#DCFCE7" stroke="#CBD5E1"/>
<text x="28" y="507" font-size="11" fill="#1E293B" text-anchor="start" font-weight="700">経営情報システム</text>
<text x="332" y="531" font-size="12" fill="#1E293B" text-anchor="end" font-weight="700">100点</text>
<rect x="16" y="560" width="328" height="66" rx="10" fill="#DBEAFE" stroke="#CBD5E1"/>
<text x="28" y="587" font-size="11" fill="#1E293B" text-anchor="start" font-weight="700">中小企業経営・中小企業政策</text>
<text x="332" y="611" font-size="12" fill="#1E293B" text-anchor="end" font-weight="700">100点</text>
<rect x="16" y="660" width="328" height="236" rx="10" fill="#FEF3C7" stroke="#CBD5E1"/>
<text x="30" y="689" font-size="11.5" fill="#1E293B" text-anchor="start" font-weight="700">7科目すべて受験する場合：</text>
<text x="30" y="718" font-size="11.5" fill="#1E293B" text-anchor="start">合計700点の60%＝420点以上</text>
<text x="30" y="747" font-size="11.5" fill="#1E293B" text-anchor="start">かつ各科目40%以上が基準</text>
<text x="30" y="776" font-size="11.5" fill="#1E293B" text-anchor="start" font-weight="700">免除科目は合否判定の対象外</text>
<text x="30" y="805" font-size="11.5" fill="#1E293B" text-anchor="start">過去の点数を加算・固定しない</text>
<text x="30" y="834" font-size="11.5" fill="#1E293B" text-anchor="start">受験科目の総点数で判定する</text>
<text x="180.0" y="883" font-size="8.5" fill="#1E293B" text-anchor="middle">出典：令和8年度試験案内／2026年10月31日確認</text></svg>
