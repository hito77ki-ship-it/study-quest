<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">償却方法｜計算の基礎と残高</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">01 単純40%で5年間計算</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">費用合計922,240円</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">期末残高77,760円が残る</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">02 保証額の指定がある例</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">4年目の86,400＜保証108,000</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">改定取得価額216,000円へ切替</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">03 最後まで残高を確認</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">4年目108,000／5年目107,999</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">累計999,999／最終残高1円</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
