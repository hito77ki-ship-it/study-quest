<title id="title">リース｜支払いと費用を分ける</title><desc id="desc">01 3年・定額利息配分の例：支払220,000円×3回、当初元本600,000／利息60,000。02 毎年の支払いと償却：元本200,000＋利息20,000、年償却200,000円（移転外・残存0）。03 残高と総額を検算：年末債務400,000→200,000→0、600,000＋60,000＝660,000円</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">リース｜支払いと費用を分ける</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">01 3年・定額利息配分の例</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">支払220,000円×3回</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">当初元本600,000／利息60,000</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">02 毎年の支払いと償却</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">元本200,000＋利息20,000</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">年償却200,000円（移転外・残存0）</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">03 残高と総額を検算</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">年末債務400,000→200,000→0</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">600,000＋60,000＝660,000円</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
