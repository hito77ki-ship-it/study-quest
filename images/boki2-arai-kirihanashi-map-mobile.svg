<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">有価証券｜内訳と期別合計を区別</title><desc id="desc">01  自作例：100→120→150円：X1年の評価益は両方式とも20円、洗替はX2年首に20円を戻す。02  X2年の損益を合算する：洗替：期首損20＋売却益50＝益30円、切放：150−120＝売却益30円。03  売値90円でも検算：両方式のX2年損失は30円、2年合計は20−30＝損失10円</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">有価証券｜内訳と期別合計を区別</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="13" font-weight="700" fill="#B6E27C">01  自作例：100→120→150円</text>
<text x="34" y="165" font-size="12" fill="#F0F6ED">X1年の評価益は両方式とも20円</text>
<text x="34" y="193" font-size="12" fill="#F0F6ED">洗替はX2年首に20円を戻す</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="13" font-weight="700" fill="#B6E27C">02  X2年の損益を合算する</text>
<text x="34" y="339" font-size="12" fill="#F0F6ED">洗替：期首損20＋売却益50＝益30円</text>
<text x="34" y="367" font-size="12" fill="#F0F6ED">切放：150−120＝売却益30円</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="13" font-weight="700" fill="#B6E27C">03  売値90円でも検算</text>
<text x="34" y="513" font-size="12" fill="#F0F6ED">両方式のX2年損失は30円</text>
<text x="34" y="541" font-size="12" fill="#F0F6ED">2年合計は20−30＝損失10円</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
