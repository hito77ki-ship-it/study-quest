<title id="title">税効果｜残高と増減を分ける</title><desc id="desc">01 期首一時差異40,000円：30%なら資産12,000円、全額回収可能の仮定。02 取崩し10,000・発生70,000：期末差異100,000円、期末資産30,000円。03 当期調整は差額18,000円：30,000−12,000＝18,000、期末残高30,000を重ねて計上しない</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">税効果｜残高と増減を分ける</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">01 期首一時差異40,000円</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">30%なら資産12,000円</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">全額回収可能の仮定</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">02 取崩し10,000・発生70,000</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">期末差異100,000円</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">期末資産30,000円</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">03 当期調整は差額18,000円</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">30,000−12,000＝18,000</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">期末残高30,000を重ねて計上しない</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
