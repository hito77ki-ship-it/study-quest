<title id="title">20代の資格選びは期限を分ける</title><desc id="desc">大学の条件：3年次だけで税法受験とはしない、社会科学と62単位等を確認。架空の提出期限：12月1日締切・15日発表、取得済みと受検済みは別。今週の記録：授業・勤務・応募準備と同じ表へ、年齢だけで学習能力を決めない</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">20代の資格選びは期限を分ける</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
