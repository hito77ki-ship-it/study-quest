<text x="46" y="160" font-size="19" fill="#F0F6ED">3年次だけで税法受験とはしない</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">社会科学と62単位等を確認</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
