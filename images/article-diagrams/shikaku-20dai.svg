<text x="46" y="325" font-size="19" fill="#F0F6ED">取得済みと受検済みは別</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">今週の記録</text>
