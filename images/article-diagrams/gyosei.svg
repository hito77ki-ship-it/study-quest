<title id="title">行政書士は三つの条件を照合</title><desc id="desc">2026年度の案内：11月8日13〜16時・受付終了、法令基準日は2026年4月1日。2025年度で計算練習：160＋20＝180でも基礎不足、156＋24＝180は三基準を満たす。答案と時間の記録：±5字・キーワード採点を断定しない、190分の予定を180分へ直す</desc>
