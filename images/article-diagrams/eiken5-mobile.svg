<title id="title">5級の形式と自作練習</title><desc id="desc">50問の構成：読む25問＋聞く25問、語句整序と内容一致を区別。語順と動詞：My brother likes music.、主語をIに変えるとlike。意味と形：They are students.、They like soccer.</desc>
