<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">5級の形式と自作練習</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">50問の構成</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">読む25問＋聞く25問</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">語句整序と内容一致を区別</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">語順と動詞</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">My brother likes music.</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">主語をIに変えるとlike</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">意味と形</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">They are students.</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">They like soccer.</text>
