<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">二級建築士の準備を分ける</title><desc id="desc">資格と登録：受験区分と必要書類、免許登録は別の手続。学科と製図：学科3時間＋3時間、設計製図5時間。架空の配分を検算：合計300分／超過25分、課題条件と図面も照合</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">二級建築士の準備を分ける</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">資格と登録</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">受験区分と必要書類</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">免許登録は別の手続</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">学科と製図</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">学科3時間＋3時間</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">設計製図5時間</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">架空の配分を検算</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">合計300分／超過25分</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">課題条件と図面も照合</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
