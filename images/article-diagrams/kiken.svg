<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">乙4は科目ごとに条件を確認</title><desc id="desc">免除なしの試験：法令15・物化10・性消10問、各60％／合計だけで判定しない。誤答数を検算：10問で3問誤答＝70％、4問誤答＝60％で基準を満たす。資格と条件を分ける：物性は物質・項目ごとに確認、甲種4種類には組合せ条件</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">乙4は科目ごとに条件を確認</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">免除なしの試験</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">法令15・物化10・性消10問</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">各60％／合計だけで判定しない</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">誤答数を検算</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">10問で3問誤答＝70％</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">4問誤答＝60％で基準を満たす</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">資格と条件を分ける</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">物性は物質・項目ごとに確認</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">甲種4種類には組合せ条件</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
