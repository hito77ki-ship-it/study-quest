<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">外務員：範囲・配点・登録</title><desc id="desc">①職務と試験の範囲：二種でも関連する基礎知識が出題、一種・二種を業務条件と照合。②形式で点数を計算：○×2点・五肢選択10点、五肢選択＝計算だけ、ではない。③合格後も登録を確認：一般受験料12,169円（税込）、試験合格だけで営業はできない</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">外務員：範囲・配点・登録</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">①職務と試験の範囲</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">二種でも関連する基礎知識が出題</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">一種・二種を業務条件と照合</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">②形式で点数を計算</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">○×2点・五肢選択10点</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">五肢選択＝計算だけ、ではない</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">③合格後も登録を確認</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">一般受験料12,169円（税込）</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">試験合格だけで営業はできない</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
