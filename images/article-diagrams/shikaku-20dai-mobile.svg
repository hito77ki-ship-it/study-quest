<title id="title">20代の資格選びは期限を分ける</title><desc id="desc">大学の条件：3年次だけで税法受験とはしない、社会科学と62単位等を確認。架空の提出期限：12月1日締切・15日発表、取得済みと受検済みは別。今週の記録：授業・勤務・応募準備と同じ表へ、年齢だけで学習能力を決めない</desc>
