<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">資格と勤務条件を別に確認</title><desc id="desc">三つの場所：自宅で学習・会場で受験、在宅勤務の条件は募集で確認。架空の募集比較：資格の歓迎と週3日勤務は別、時間・場所・研修を照合。架空の週間枠：CもDも120分、能力や合格時期を決める値ではない</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">資格と勤務条件を別に確認</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">三つの場所</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">自宅で学習・会場で受験</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">在宅勤務の条件は募集で確認</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">架空の募集比較</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">資格の歓迎と週3日勤務は別</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">時間・場所・研修を照合</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">架空の週間枠</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">CもDも120分</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">能力や合格時期を決める値ではない</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
