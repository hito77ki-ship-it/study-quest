<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">秘書検定：方式と敬語の確認</title><desc id="desc">①紙とCBTを分ける：2級CBTは33問・100分、準1級は筆記合格後に面接。②理論と実技の基準：それぞれ60%以上、一方の不足を平均で補わない。③敬語は場面と働き：行為者・向かう先・話す相手、主語だけで一律に決めない</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">秘書検定：方式と敬語の確認</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">①紙とCBTを分ける</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">2級CBTは33問・100分</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">準1級は筆記合格後に面接</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">②理論と実技の基準</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">それぞれ60%以上</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">一方の不足を平均で補わない</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">③敬語は場面と働き</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">行為者・向かう先・話す相手</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">主語だけで一律に決めない</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
