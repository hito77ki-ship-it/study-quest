<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">30代は経験の中身を照合</title><desc id="desc">実務の確認：一般の勤続3年と所定実務は別、証明する作業と期間を確認。架空の時間枠：20分×4＋60＋40＝180分、四週間12時間と暦月は区別。説明材料：担当・判断・確認結果を分ける、年齢だけで市場価値を決めない</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">30代は経験の中身を照合</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">実務の確認</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">一般の勤続3年と所定実務は別</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">証明する作業と期間を確認</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">架空の時間枠</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">20分×4＋60＋40＝180分</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">四週間12時間と暦月は区別</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">説明材料</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">担当・判断・確認結果を分ける</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">年齢だけで市場価値を決めない</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
