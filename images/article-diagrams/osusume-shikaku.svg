<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">資格選びは目的と入口を分ける</title><desc id="desc">10候補の使い方：採用・人気の順位ではない、希望業務と公式範囲を照合。架空求人3件：必須1・歓迎1・記載なし1、市場の割合へ拡張しない。架空の費用比較：X：16,000円　Y：30,000円、教材無料と総費用は別</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">資格選びは目的と入口を分ける</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
