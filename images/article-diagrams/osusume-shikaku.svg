<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">10候補の使い方</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">採用・人気の順位ではない</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">希望業務と公式範囲を照合</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">架空求人3件</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">必須1・歓迎1・記載なし1</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">市場の割合へ拡張しない</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">架空の費用比較</text>
