<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">衛生管理者：三つの確認</title><desc id="desc">①問題数と配点：第一種44問・400点、第二種30問・300点。②合格基準は両方：範囲・科目ごと40%以上、かつ、合計60%以上。③受験と免許の手続き：一般勤務と労働衛生実務を区別、合格後も免許申請が必要</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">衛生管理者：三つの確認</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">①問題数と配点</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">第一種44問・400点</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">第二種30問・300点</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">②合格基準は両方</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">範囲・科目ごと40%以上</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">かつ、合計60%以上</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">③受験と免許の手続き</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">一般勤務と労働衛生実務を区別</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">合格後も免許申請が必要</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
