<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">2級の要約と意見を分ける</title><desc id="desc">一次と二次の形式：読む・書く85分、聞く2部、二次の描写は3コマ。要約：原文の計画・期待・懸念を残す、ない意見・実績を足さない。意見論述：問いへの答えと理由・説明、言い換えだけの二理由にしない</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">2級の要約と意見を分ける</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">一次と二次の形式</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">読む・書く85分、聞く2部</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">二次の描写は3コマ</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">要約</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">原文の計画・期待・懸念を残す</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">ない意見・実績を足さない</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">意見論述</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">問いへの答えと理由・説明</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">言い換えだけの二理由にしない</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
