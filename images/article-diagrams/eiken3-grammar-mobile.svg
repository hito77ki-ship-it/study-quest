<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">名詞・関係節・間接疑問</title><desc id="desc">名詞と訳：some informationを確認、isを「あった」と訳さない。主語か目的語か：whoはhelpsの主語、I borrowedの目的語を確認。疑問部分の語順：where Mina livesを確認、who calledはwho自体が主語</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">名詞・関係節・間接疑問</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">名詞と訳</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">some informationを確認</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">isを「あった」と訳さない</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">主語か目的語か</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">whoはhelpsの主語</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">I borrowedの目的語を確認</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">疑問部分の語順</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">where Mina livesを確認</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">who calledはwho自体が主語</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
