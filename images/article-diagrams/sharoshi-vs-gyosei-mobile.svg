<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">社労士と行政書士は入口と業務で選ぶ</title><desc id="desc">受験経路：行政書士合格は社労士の一経路、全員に先行取得が必要ではない。架空の起業相談：定款・登記・社会保険を分ける、二資格ですべて受任とはしない。選ぶ前のシート：希望業務と未確認条件を書く、安定収入や短縮効果は保証しない</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">社労士と行政書士は入口と業務で選ぶ</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">受験経路</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">行政書士合格は社労士の一経路</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">全員に先行取得が必要ではない</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">架空の起業相談</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">定款・登記・社会保険を分ける</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">二資格ですべて受任とはしない</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">選ぶ前のシート</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">希望業務と未確認条件を書く</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">安定収入や短縮効果は保証しない</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
