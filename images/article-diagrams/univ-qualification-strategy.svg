<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">自分の担当</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">企画・判断・検証を具体化</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">AI等の補助範囲も区別</text>
