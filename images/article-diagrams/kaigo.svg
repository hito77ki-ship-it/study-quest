<title id="title">ケアマネ：経験と手続きを分ける</title><desc id="desc">①対象となる業務を確認：国家資格の登録前後を分ける、期間5年以上、かつ900日以上。②二分野を別に記録：介護支援25問／もう一方35問、合計だけで不足を埋めない。③合格後も手続きがある：実務研修→資格登録、介護支援専門員証の交付</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">ケアマネ：経験と手続きを分ける</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">①対象となる業務を確認</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">国家資格の登録前後を分ける</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">期間5年以上、かつ900日以上</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">②二分野を別に記録</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">介護支援25問／もう一方35問</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">合計だけで不足を埋めない</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">③合格後も手続きがある</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">実務研修→資格登録</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">介護支援専門員証の交付</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
