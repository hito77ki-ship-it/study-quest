<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">基本情報 vs 応用情報 どっちを先に取るべき？の図解サムネイル</title>
  <desc id="desc">資格比較。基本情報、応用情報 どっちを先に取る</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#152447"/><stop offset="1" stop-color="#0A1126"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity=".055"/></pattern>
    <style>
      .font{font-family:'Hiragino Sans','Noto Sans JP',system-ui,sans-serif}.tag{font:700 13px 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;letter-spacing:.08em;fill:#0A1126}.h1{font:800 31px 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;fill:#FFFFFF}.h2{font:700 18px 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;fill:#FFF8EB}.note{font:700 12px 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;fill:#B7C6E6}.side{font:800 16px 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;fill:#FFFFFF}.vs{font:900 18px 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;fill:#0A1126}.goal{font:900 14px 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;fill:#FFB545}.letters{font:800 28px 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;fill:#FFB545}
    </style>
  </defs>
  <rect width="640" height="360" rx="18" fill="url(#bg)"/><rect width="640" height="360" rx="18" fill="url(#grid)"/>
  <rect x="28" y="28" width="92" height="30" rx="15" fill="#FFB545"/>
  <text x="42" y="48" class="tag">資格比較</text>
  <circle cx="60" cy="100" r="7" fill="#FFB545"/><path d="M76 100h64" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="2"/>
  <text x="34" y="151" class="h1">基本情報</text>
  <text x="34" y="190" class="h1">応用情報 どっちを先に取る</text>
  <text x="35" y="228" class="note">記事の要点をひと目でつかむ</text>
  <rect x="28" y="281" width="285" height="45" rx="12" fill="#FFFFFF" fill-opacity=".10" stroke="#FFFFFF" stroke-opacity=".18"/>
  <text x="48" y="310" class="h2">どっちを選ぶ？</text>

    <rect x="398" y="113" width="105" height="158" rx="18" fill="#121D35" stroke="#FFB545" stroke-width="3"/>
    <rect x="531" y="113" width="105" height="158" rx="18" fill="#121D35" stroke="#FFB545" stroke-width="3"/>
    <text x="450" y="175" text-anchor="middle" class="side">基本情報</text><text x="583" y="175" text-anchor="middle" class="side">応用情報 どっちを先に取る</text>
    <circle cx="517" cy="192" r="31" fill="#F97316"/><text x="517" y="202" text-anchor="middle" class="vs">VS</text>
    <path d="M440 230h35m84 0h35" fill="none" stroke="#FFB545" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>