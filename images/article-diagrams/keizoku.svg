<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">続いた日数と理解を分ける</title><desc id="desc">習慣研究の範囲：同じ状況で行う行動の研究、資格合格までの日数ではない。二つの記録：いつ実施したか、何を自力で説明できたか。戻り先を残す：止めた箇所と次の一問、実施後に不明点を更新</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">続いた日数と理解を分ける</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">習慣研究の範囲</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">同じ状況で行う行動の研究</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">資格合格までの日数ではない</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">二つの記録</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">いつ実施したか</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">何を自力で説明できたか</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">戻り先を残す</text>
