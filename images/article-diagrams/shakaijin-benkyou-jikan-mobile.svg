<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">週間の枠と演習時間を検算する</title><desc id="desc">架空の予定：最小280分／最大350分、社会人の平均値ではない。変更があった週：土曜90分なしなら190分、翌日へ自動で積み増さない。演習と見直し：90＋15＋25＝130分、120分枠を10分超える</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">週間の枠と演習時間を検算する</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">架空の予定</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">最小280分／最大350分</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">社会人の平均値ではない</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">変更があった週</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">土曜90分なしなら190分</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">翌日へ自動で積み増さない</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">演習と見直し</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">90＋15＋25＝130分</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">120分枠を10分超える</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
