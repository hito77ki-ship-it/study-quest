<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">10候補の使い方</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">採用・人気の順位ではない</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">希望業務と公式範囲を照合</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">架空求人3件</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">必須1・歓迎1・記載なし1</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">市場の割合へ拡張しない</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
