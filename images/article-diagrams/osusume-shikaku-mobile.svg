<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">資格選びは目的と入口を分ける</title><desc id="desc">10候補の使い方：採用・人気の順位ではない、希望業務と公式範囲を照合。架空求人3件：必須1・歓迎1・記載なし1、市場の割合へ拡張しない。架空の費用比較：X：16,000円　Y：30,000円、教材無料と総費用は別</desc>
