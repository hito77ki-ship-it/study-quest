<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">2級の要約と意見を分ける</title><desc id="desc">一次と二次の形式：読む・書く85分、聞く2部、二次の描写は3コマ。要約：原文の計画・期待・懸念を残す、ない意見・実績を足さない。意見論述：問いへの答えと理由・説明、言い換えだけの二理由にしない</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">2級の要約と意見を分ける</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">一次と二次の形式</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">読む・書く85分、聞く2部</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">二次の描写は3コマ</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">要約</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">原文の計画・期待・懸念を残す</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">ない意見・実績を足さない</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">意見論述</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">問いへの答えと理由・説明</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">言い換えだけの二理由にしない</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
