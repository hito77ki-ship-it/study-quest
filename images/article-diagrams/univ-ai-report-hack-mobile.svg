<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">録音から提出まで四つの条件</title><desc id="desc">先にルール確認：録音・撮影と外部送信、課題でのAI利用は別条件。文字起こしを照合：数値・否定・用語を原音へ、不明なものを補わない。根拠と考察を分ける：読んだ資料の該当箇所、自作部分とAI利用を記録</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">録音から提出まで四つの条件</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">先にルール確認</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">録音・撮影と外部送信</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">課題でのAI利用は別条件</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">文字起こしを照合</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">数値・否定・用語を原音へ</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">不明なものを補わない</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">根拠と考察を分ける</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">読んだ資料の該当箇所</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">自作部分とAI利用を記録</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
