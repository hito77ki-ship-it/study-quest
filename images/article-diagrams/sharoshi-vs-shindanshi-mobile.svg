<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">社労士と診断士は相談から比較</title><desc id="desc">相談を分ける：労務の手続・制度の相談、売り場の収支など経営課題。架空の5科目得点：305／500点でも35点の科目は不足、免除科目の前年得点は足さない。費用と取得後：試験料と講習・登録費は別、資格だけで安定収入とはしない</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">社労士と診断士は相談から比較</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">相談を分ける</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">労務の手続・制度の相談</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">売り場の収支など経営課題</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">架空の5科目得点</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">305／500点でも35点の科目は不足</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">免除科目の前年得点は足さない</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">費用と取得後</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">試験料と講習・登録費は別</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">資格だけで安定収入とはしない</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
