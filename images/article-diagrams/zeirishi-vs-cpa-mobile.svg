<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">税理士と会計士は登録まで区別</title><desc id="desc">税理士の科目：会計学2＋条件付き税法3、所得税法または法人税法を含む。会計士の免除：翌・翌々試験年等の条件を確認、完全な一発勝負としない。試験合格と登録：合格証だけで二資格取得ではない、実務・補習・税法研修等を確認</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">税理士と会計士は登録まで区別</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">税理士の科目</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">会計学2＋条件付き税法3</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">所得税法または法人税法を含む</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">会計士の免除</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">翌・翌々試験年等の条件を確認</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">完全な一発勝負としない</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">試験合格と登録</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">合格証だけで二資格取得ではない</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">実務・補習・税法研修等を確認</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
