<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">募集条件と自分の証拠で選ぶ</title><desc id="desc">公式範囲と仕事：資格が測る範囲を読む、採用条件は応募先で確認。架空の三つの募集：必須・歓迎・記載なし、共通条件に置き換えない。自分の担当：企画・判断・検証を具体化、AI等の補助範囲も区別</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">募集条件と自分の証拠で選ぶ</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">公式範囲と仕事</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">資格が測る範囲を読む</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">採用条件は応募先で確認</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">架空の三つの募集</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">必須・歓迎・記載なし</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">共通条件に置き換えない</text>
