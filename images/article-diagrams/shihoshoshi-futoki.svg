<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">不動産登記法・所有権移転・抵当権設定の図解サムネイル</title>
  <desc id="desc">司法書士。不動産登記法、・所有権移転・抵当権設定</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#152447"/><stop offset="1" stop-color="#0A1126"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity=".055"/></pattern>
    <style>
      .font{font-family:'Hiragino Sans','Noto Sans JP',system-ui,sans-serif}.tag{font:700 13px 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;letter-spacing:.08em;fill:#0A1126}.h1{font:800 31px 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;fill:#FFFFFF}.h2{font:700 18px 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;fill:#F0FFFF}.note{font:700 12px 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;fill:#B7C6E6}.side{font:800 16px 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;fill:#FFFFFF}.vs{font:900 18px 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;fill:#0A1126}.goal{font:900 14px 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;fill:#54D4D2}.letters{font:800 28px 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;fill:#54D4D2}
    </style>
  </defs>
  <rect width="640" height="360" rx="18" fill="url(#bg)"/><rect width="640" height="360" rx="18" fill="url(#grid)"/>
  <rect x="28" y="28" width="92" height="30" rx="15" fill="#54D4D2"/>
  <text x="42" y="48" class="tag">司法書士</text>
  <circle cx="60" cy="100" r="7" fill="#54D4D2"/><path d="M76 100h64" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="2"/>
  <text x="34" y="151" class="h1">不動産登記法</text>
