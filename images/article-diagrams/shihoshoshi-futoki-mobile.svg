<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">不動産登記を条件で組み立てる</title><desc id="desc">原因と申請人：売買の共同／相続の単独、誰の何が変わるか。証明と確認：契約の名前だけで決めない、特約の条件成就も照合。前後を明示する連件：前件名義人が後件義務者、規則67条の条件を確認</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">不動産登記を条件で組み立てる</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">原因と申請人</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">売買の共同／相続の単独</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">誰の何が変わるか</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">証明と確認</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">契約の名前だけで決めない</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">特約の条件成就も照合</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">前後を明示する連件</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">前件名義人が後件義務者</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">規則67条の条件を確認</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
