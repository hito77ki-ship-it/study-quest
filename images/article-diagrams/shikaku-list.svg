<title id="title">一覧は記事を探す入口</title><desc id="desc">資格名・目的・比較：順位・必要時間の固定表ではない、検索件数は受験可否を示さない。架空の検索例：FP2級・3級と比較記事は別、級・団体・実技等を確認。年度と形式：CBTでも休止・予約範囲は別、申込・試験・発表・登録を分ける</desc>
