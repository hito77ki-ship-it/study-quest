<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">就活は条件と担当を分けて説明</title><desc id="desc">募集の原文：必須・歓迎・予定可を区別、必要な時点と提出方法を確認。架空の制作例：企画・判断・検証とAI実装、すべて自作という説明にしない。準備の記録：学習・応募・制作を並べる、本人の事実と未確認事項を残す</desc>
