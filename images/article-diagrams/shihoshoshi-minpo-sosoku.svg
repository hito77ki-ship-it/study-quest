<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">代理と時効は条件を分ける</title><desc id="desc">代理の三人：本人A・代理人B・相手方C、権限と実際の行為を分ける。条文ごとの要件：実印だけで正当理由を確定しない、消滅後と範囲超過は別。架空の時効の比較：2024＋5と2022＋10、特則・更新・援用等は別確認</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">代理と時効は条件を分ける</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">代理の三人</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">本人A・代理人B・相手方C</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">権限と実際の行為を分ける</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">条文ごとの要件</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">実印だけで正当理由を確定しない</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">消滅後と範囲超過は別</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">架空の時効の比較</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">2024＋5と2022＋10</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">特則・更新・援用等は別確認</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
