<title id="title">決算書は列と注記を照合</title><desc id="desc">年度と単位：2025年度末は2026年3月末、金額は百万円。のれんの増減：期首＋165185＝期末、取得以外の変動も読む。取得例の前提：公正価値・非支配持分、架空例と実際の取引を分ける</desc>
