<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">資格を取っても人生が変わりやすい人・変わりにくい人の図解サムネイル</title>
  <desc id="desc">考え方。資格を取っても人生が変わり、やすい人・変わりにくい人</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#152447"/><stop offset="1" stop-color="#0A1126"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity=".055"/></pattern>
    <style>
      .font{font-family:'Hiragino Sans','Noto Sans JP',system-ui,sans-serif}.tag{font:700 13px 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;letter-spacing:.08em;fill:#0A1126}.h1{font:800 26px 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;fill:#FFFFFF}.h2{font:700 18px 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;fill:#F8FFF2}.note{font:700 12px 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;fill:#B7C6E6}.side{font:800 16px 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;fill:#FFFFFF}.vs{font:900 18px 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;fill:#0A1126}.goal{font:900 14px 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;fill:#A7E84A}.letters{font:800 28px 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;fill:#A7E84A}
    </style>
  </defs>
  <rect width="640" height="360" rx="18" fill="url(#bg)"/><rect width="640" height="360" rx="18" fill="url(#grid)"/>
  <rect x="28" y="28" width="92" height="30" rx="15" fill="#A7E84A"/>
  <text x="42" y="48" class="tag">考え方</text>
  <circle cx="60" cy="100" r="7" fill="#A7E84A"/><path d="M76 100h64" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="2"/>
  <text x="34" y="151" class="h1">資格を取っても人生が変わり</text>
  <text x="34" y="190" class="h1">やすい人・変わりにくい人</text>
  <text x="35" y="228" class="note">記事の要点をひと目でつかむ</text>
  <rect x="28" y="281" width="285" height="45" rx="12" fill="#FFFFFF" fill-opacity=".10" stroke="#FFFFFF" stroke-opacity=".18"/>
  <text x="48" y="310" class="h2">次の一手がわかる</text>

    <circle cx="520" cy="185" r="77" fill="#121D35" stroke="#A7E84A" stroke-width="3"/>
    <path d="M520 129v56l38 24M520 94v14M520 262v14M429 185h14M597 185h14" fill="none" stroke="#A7E84A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="520" cy="185" r="9" fill="#5AAE39"/>
</svg>