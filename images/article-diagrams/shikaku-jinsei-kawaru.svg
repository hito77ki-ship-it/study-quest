<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">資格に期待する変化を分ける</title><desc id="desc">目標の整理：知識・応募・業務・関心、仕事以外の学びも目的になる。架空の六週間：予定12時間・実績10時間、時間だけで合格日や性格を決めない。次の判断：公式の入口条件と未確認事項、保留や目標変更も記録する</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">資格に期待する変化を分ける</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">目標の整理</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">知識・応募・業務・関心</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">仕事以外の学びも目的になる</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">架空の六週間</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">予定12時間・実績10時間</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">時間だけで合格日や性格を決めない</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">次の判断</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">公式の入口条件と未確認事項</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">保留や目標変更も記録する</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
