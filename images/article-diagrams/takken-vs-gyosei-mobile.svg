<title id="title">宅建と行政書士は権限を分ける</title><desc id="desc">試験と制度：2025宅建18.7％・33／50点、固定の上位15％としない。架空の事業計画：取引士証・行政書士登録、事業免許・登記権限は別確認。学習の対応：共通する条文と新しい形式、短縮率・取得順を保証しない</desc>
