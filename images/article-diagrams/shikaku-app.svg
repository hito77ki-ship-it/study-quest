<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">アプリ比較は役割と確認状態を分ける</title><desc id="desc">教材・記録・コース：提供元の案内を比較、自社紹介と他社実測は区別。架空の支払い比較：36,000円と3,300円×12回、分割払いと月額契約は別。記録の確認：時間・科目・メモと再読込、保存表示だけで完了にしない</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">アプリ比較は役割と確認状態を分ける</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">教材・記録・コース</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">提供元の案内を比較</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">自社紹介と他社実測は区別</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">架空の支払い比較</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">36,000円と3,300円×12回</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">分割払いと月額契約は別</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">記録の確認</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">時間・科目・メモと再読込</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">保存表示だけで完了にしない</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
