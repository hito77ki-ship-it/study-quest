<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">社労士と診断士は相談から比較</title><desc id="desc">相談を分ける：労務の手続・制度の相談、売り場の収支など経営課題。架空の5科目得点：305／500点でも35点の科目は不足、免除科目の前年得点は足さない。費用と取得後：試験料と講習・登録費は別、資格だけで安定収入とはしない</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">社労士と診断士は相談から比較</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">相談を分ける</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">労務の手続・制度の相談</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">売り場の収支など経営課題</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">架空の5科目得点</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">305／500点でも35点の科目は不足</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">免除科目の前年得点は足さない</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">費用と取得後</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">試験料と講習・登録費は別</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">資格だけで安定収入とはしない</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
