<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">経済・経営学部の資格選び</title><desc id="desc">使う場面を先に書く：授業の課題・志望分野を具体化、学部名だけで全員同じにしない。受験条件と範囲を確認：簿記の学習順と必須条件は別、FPは級・実技・受検経路を確認。予定と実績を照合：予定180分・実績120分の仮定、差60分と、未解消の課題を記録</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">経済・経営学部の資格選び</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">使う場面を先に書く</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">授業の課題・志望分野を具体化</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">学部名だけで全員同じにしない</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">受験条件と範囲を確認</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">簿記の学習順と必須条件は別</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">FPは級・実技・受検経路を確認</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">予定と実績を照合</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">予定180分・実績120分の仮定</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">差60分と、未解消の課題を記録</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
