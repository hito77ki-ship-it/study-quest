<title id="title">勤務表から資格学習を組み立てる</title><desc id="desc">仕事の課題：資格名より使う場面を書く、対象範囲との対応を確認。受験と登録：資格・証明書・締切を照合、合格後の手続も別に確認。架空の勤務週：予定115分／休日なし55分、時間と理解の記録を分ける</desc>
