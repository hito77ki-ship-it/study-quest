<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">保育士：同一回と期間の確認</title><desc id="desc">①教育原理・社会的養護：同じ回で、どちらも60%以上、別の回の高得点を合成しない。②科目合格の期間：原則、合格年を含む3年、延長は対象条件と手続きを確認。③後期実技の案内：言語は3課題から入室後に指定、2分野は申請後に変更できない</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">保育士：同一回と期間の確認</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">①教育原理・社会的養護</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">同じ回で、どちらも60%以上</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">別の回の高得点を合成しない</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">②科目合格の期間</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">原則、合格年を含む3年</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">延長は対象条件と手続きを確認</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">③後期実技の案内</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">言語は3課題から入室後に指定</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">2分野は申請後に変更できない</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
