<title id="title">FP2級は条件と分母を確認</title><desc id="desc">受検資格：3級の表示得点と正式発表は別、合格番号等の条件を確認。実技の違い：日本FP協会：60／100点、金財：30／50点。架空の支払い比較：A：1,710万円　B：1,716万円、月額だけで総額を判断しない</desc>
