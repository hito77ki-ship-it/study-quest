<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">宅建と管理士は日付も分ける</title><desc id="desc">役割の違い：取引の説明と管理運営の相談、管理業務主任者とも別資格。2026年度の計画：9月30日締切→11月25日発表、発表を待ってから同年申込は不可。架空の準備判断：10月18日→11月29日は42日、標準の必要期間とはしない</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">宅建と管理士は日付も分ける</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">役割の違い</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">取引の説明と管理運営の相談</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">管理業務主任者とも別資格</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">2026年度の計画</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">9月30日締切→11月25日発表</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">発表を待ってから同年申込は不可</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">架空の準備判断</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">10月18日→11月29日は42日</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">標準の必要期間とはしない</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
