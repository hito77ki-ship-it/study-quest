<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">試験選びは提出先の条件から</title><desc id="desc">技能と方式：L&amp;RとS&amp;Wは別、英検も級・方式を確認。架空の提出条件：級を満たしても点数は別、2150は2200未満。利用先で照合：認める試験・期間・証明、独自換算で条件を埋めない</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">試験選びは提出先の条件から</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">技能と方式</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">L&amp;RとS&amp;Wは別</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">英検も級・方式を確認</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">架空の提出条件</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">級を満たしても点数は別</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">2150は2200未満</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">利用先で照合</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">認める試験・期間・証明</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">独自換算で条件を埋めない</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
