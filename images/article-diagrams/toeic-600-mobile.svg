<title id="title">600点目標の前に確かめる条件</title><desc id="desc">公式形式：Listening 約45分・100問、Reading 75分・100問。目標と採点を分ける：600点は共通の合格点ではない、正答率の固定換算はしない。基礎の自作例：開始10:30／到着10:20、are＋checkedの根拠を説明</desc>
