<title id="title">社労士は採点単位で基準を確認</title><desc id="desc">採点上の科目：選択式8・択一式7、学ぶ法分野の数とは区別。2026年度の架空得点：選択27点でも雇用1点は不足、択一51点でも1科目3点は不足。受験と登録：受験資格の実務と登録の実務は別、合格後も登録条件を確認</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">社労士は採点単位で基準を確認</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
