<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">採点上の科目</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">選択式8・択一式7</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">学ぶ法分野の数とは区別</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">2026年度の架空得点</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">選択27点でも雇用1点は不足</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">択一51点でも1科目3点は不足</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">受験と登録</text>
