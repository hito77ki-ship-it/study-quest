<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">マンション管理士の条件を読む</title><desc id="desc">国家資格と登録：民間資格との旧説明を訂正、合格と登録の条件は別。現行の制度と資料：2026年4月1日の法令、法律と標準管理規約を分ける。架空の決議を検算：人数75％／議決権72.5％、両方の分母で確認</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">マンション管理士の条件を読む</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">国家資格と登録</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">民間資格との旧説明を訂正</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">合格と登録の条件は別</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">現行の制度と資料</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">2026年4月1日の法令</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">法律と標準管理規約を分ける</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">架空の決議を検算</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">人数75％／議決権72.5％</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">両方の分母で確認</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
