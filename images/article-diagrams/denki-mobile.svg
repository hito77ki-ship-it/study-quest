<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">第二種電気工事士の準備</title><desc id="desc">学科と技能を分ける：学科50問・120分、第二種の技能は40分。年度別に日程を確認：2027年度学科はCBTへ移行、出願と会場予約は別の期間。欠陥と免除を点検：軽欠陥の個数で判定しない、学科免除は有効回と申請を確認</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">第二種電気工事士の準備</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">学科と技能を分ける</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">学科50問・120分</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">第二種の技能は40分</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">年度別に日程を確認</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">2027年度学科はCBTへ移行</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">出願と会場予約は別の期間</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">欠陥と免除を点検</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">軽欠陥の個数で判定しない</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">学科免除は有効回と申請を確認</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
