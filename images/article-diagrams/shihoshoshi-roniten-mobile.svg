<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">論点一覧は戻る先の地図</title><desc id="desc">公式の全体構成：午前35問／午後35問と記述2問、科目別の固定比率と混ぜない。権利と申請をつなぐ：条文の要件と設例の事実、登記の原因・申請人・情報。架空の得点を検算：最低点合計229は総合に不足、必要な29点と不足論点を分ける</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">論点一覧は戻る先の地図</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">公式の全体構成</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">午前35問／午後35問と記述2問</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">科目別の固定比率と混ぜない</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">権利と申請をつなぐ</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">条文の要件と設例の事実</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">登記の原因・申請人・情報</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">架空の得点を検算</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">最低点合計229は総合に不足</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">必要な29点と不足論点を分ける</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
