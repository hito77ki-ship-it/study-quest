<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">医療事務：試験と点数の確認</title><desc id="desc">①試験の現在を確認：旧主催団体は2026年3月末解散、現行の主催者・要項を先に読む。②点・円・負担額を分ける：一点10円は費用額の計算、点数だけで窓口額を決めない。③算定の条件を確認：施設基準・適用日等を照合、買物の還元ポイントとは違う</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">医療事務：試験と点数の確認</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">①試験の現在を確認</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">旧主催団体は2026年3月末解散</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">現行の主催者・要項を先に読む</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">②点・円・負担額を分ける</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">一点10円は費用額の計算</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">点数だけで窓口額を決めない</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">③算定の条件を確認</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">施設基準・適用日等を照合</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">買物の還元ポイントとは違う</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
