<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">中断した状況から対応を選ぶ</title><desc id="desc">予定と理解を分ける：残業で開けない／用語で止まる、同じ原因と決めつけない。条件を更新する：範囲・受験資格・実施日、未公表を推測で埋めない。三つの選択：再開・延期・終了を比較、理由と次の作業を記録</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">中断した状況から対応を選ぶ</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">予定と理解を分ける</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">残業で開けない／用語で止まる</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">同じ原因と決めつけない</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">条件を更新する</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">範囲・受験資格・実施日</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">未公表を推測で埋めない</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">三つの選択</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">再開・延期・終了を比較</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">理由と次の作業を記録</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
