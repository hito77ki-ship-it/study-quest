<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">ケアマネ：経験と手続きを分ける</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">①対象となる業務を確認</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">国家資格の登録前後を分ける</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">期間5年以上、かつ900日以上</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">②二分野を別に記録</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">介護支援25問／もう一方35問</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">合計だけで不足を埋めない</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">③合格後も手続きがある</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">実務研修→資格登録</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">介護支援専門員証の交付</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
