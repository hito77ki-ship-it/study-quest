<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">介護福祉士：三つの区別</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">①経験の日数と期間</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">従業期間3年・1,095日以上</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">かつ従事540日以上等を照合</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">②科目と判定の単位</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">13科目と11科目群は別</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">パート内すべての科目群も点検</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
