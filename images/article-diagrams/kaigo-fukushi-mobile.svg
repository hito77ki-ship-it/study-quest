<title id="title">介護福祉士：三つの区別</title><desc id="desc">①経験の日数と期間：従業期間3年・1,095日以上、かつ従事540日以上等を照合。②科目と判定の単位：13科目と11科目群は別、パート内すべての科目群も点検。③パート合格の受験方法：第38回の対象結果を引き継ぐ、不合格の好きな一部は選べない</desc>
