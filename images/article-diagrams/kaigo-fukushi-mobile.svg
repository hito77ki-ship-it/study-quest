<text x="34" y="513" font-size="14" fill="#F0F6ED">第38回の対象結果を引き継ぐ</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">不合格の好きな一部は選べない</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
