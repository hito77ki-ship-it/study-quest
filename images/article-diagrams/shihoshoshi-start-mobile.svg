<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">最初の7日間を確認に使う</title><desc id="desc">公式案内を整理：年度・申込・試験・結果、未公表を予測で埋めない。条文と一問を照合：本人・代理人・相手方、事実と要件を対応させる。架空の記録を検算：7日間の合計140分、時間と理解を別に見る</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">最初の7日間を確認に使う</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">公式案内を整理</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">年度・申込・試験・結果</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">未公表を予測で埋めない</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">条文と一問を照合</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">本人・代理人・相手方</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">事実と要件を対応させる</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">架空の記録を検算</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">7日間の合計140分</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">時間と理解を別に見る</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
