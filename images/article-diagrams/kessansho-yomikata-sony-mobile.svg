<title id="title">決算書は列と注記を照合</title><desc id="desc">年度と単位：2025年度末は2026年3月末、金額は百万円。のれんの増減：期首＋165185＝期末、取得以外の変動も読む。取得例の前提：公正価値・非支配持分、架空例と実際の取引を分ける</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">決算書は列と注記を照合</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">年度と単位</text>
