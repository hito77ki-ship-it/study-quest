<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">資格に期待する変化を分ける</title><desc id="desc">目標の整理：知識・応募・業務・関心、仕事以外の学びも目的になる。架空の六週間：予定12時間・実績10時間、時間だけで合格日や性格を決めない。次の判断：公式の入口条件と未確認事項、保留や目標変更も記録する</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">資格に期待する変化を分ける</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">目標の整理</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">知識・応募・業務・関心</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">仕事以外の学びも目的になる</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">架空の六週間</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">予定12時間・実績10時間</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">時間だけで合格日や性格を決めない</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
