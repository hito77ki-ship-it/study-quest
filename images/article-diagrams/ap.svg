<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">応用情報技術者試験の完全ガイドの図解サムネイル</title>
  <desc id="desc">応用情報。応用情報技術者試、験</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#152447"/><stop offset="1" stop-color="#0A1126"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity=".055"/></pattern>
    <style>
      .font{font-family:'Hiragino Sans','Noto Sans JP',system-ui,sans-serif}.tag{font:700 13px 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;letter-spacing:.08em;fill:#0A1126}.h1{font:800 31px 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;fill:#FFFFFF}.h2{font:700 18px 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;fill:#F4FAFF}.note{font:700 12px 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;fill:#B7C6E6}.side{font:800 16px 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;fill:#FFFFFF}.vs{font:900 18px 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;fill:#0A1126}.goal{font:900 14px 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;fill:#69C5FF}.letters{font:800 28px 'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;fill:#69C5FF}
    </style>
  </defs>
  <rect width="640" height="360" rx="18" fill="url(#bg)"/><rect width="640" height="360" rx="18" fill="url(#grid)"/>
  <rect x="28" y="28" width="92" height="30" rx="15" fill="#69C5FF"/>
  <text x="42" y="48" class="tag">応用情報</text>
  <circle cx="60" cy="100" r="7" fill="#69C5FF"/><path d="M76 100h64" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="2"/>
  <text x="34" y="151" class="h1">応用情報技術者試</text>
  <text x="34" y="190" class="h1">験</text>
  <text x="35" y="228" class="note">記事の要点をひと目でつかむ</text>
  <rect x="28" y="281" width="285" height="45" rx="12" fill="#FFFFFF" fill-opacity=".10" stroke="#FFFFFF" stroke-opacity=".18"/>
  <text x="48" y="310" class="h2">全体像をつかむ</text>

    <rect x="401" y="106" width="238" height="164" rx="16" fill="#121D35" stroke="#69C5FF" stroke-width="3"/>
    <circle cx="425" cy="130" r="7" fill="#2772E8"/><circle cx="449" cy="130" r="7" fill="#69C5FF"/>
    <path d="M433 172l-18 16 18 16m32-32 18 16-18 16M502 212l15-49M543 176h58m-58 30h44" fill="none" stroke="#69C5FF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
