<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">3ヶ月の資格計画で分ける条件</title><desc id="desc">四つの期限：申込・受験・結果・提出、同じ日にはならない。時間は自分の仮定：90日×90分＝135時間、12週の別案は28時間。未公表は未公表：再開日や空席を推測しない、使えた枠と解答で見直す</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">3ヶ月の資格計画で分ける条件</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">四つの期限</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">申込・受験・結果・提出</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">同じ日にはならない</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">時間は自分の仮定</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">90日×90分＝135時間</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">12週の別案は28時間</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">未公表は未公表</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">再開日や空席を推測しない</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">使えた枠と解答で見直す</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
