<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">英検の級と判定を分ける</title><desc id="desc">準2級プラスを含む8級：5級から1級までの位置を確認、学校段階は年齢制限ではない。CSEの判定：一次R・L・W、二次Sは別、正答数から一定倍しない。年度と受験方式：2026年度第3回一次は2027年、支払方法ごとの締切も確認</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">英検の級と判定を分ける</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">準2級プラスを含む8級</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">5級から1級までの位置を確認</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">学校段階は年齢制限ではない</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">CSEの判定</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">一次R・L・W、二次Sは別</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">正答数から一定倍しない</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">年度と受験方式</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">2026年度第3回一次は2027年</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">支払方法ごとの締切も確認</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
