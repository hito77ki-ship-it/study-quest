<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">二つの資格を並行する前に</title><desc id="desc">期限を並べる：出願・試験・大学の予定、知識の重なりと固有課題は別。使える枠と比較：予定90＋60＝150分の例、容量120分なら30分不足。課題を再計画：8対2を成功の法則にしない、移す課題・変更理由を残す</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">二つの資格を並行する前に</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">期限を並べる</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">出願・試験・大学の予定</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">知識の重なりと固有課題は別</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">使える枠と比較</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">予定90＋60＝150分の例</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">容量120分なら30分不足</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">課題を再計画</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">8対2を成功の法則にしない</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">移す課題・変更理由を残す</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
