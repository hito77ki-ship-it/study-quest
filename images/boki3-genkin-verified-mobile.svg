<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">現金と当座｜条件を順に読む</title><desc id="desc">01 誰が振り出したか：他人振出を保有→現金、自己振出の受取→当座預金。02 直ちに預けたか：受入と預入をまとめる、預入先の科目で記録。03 帳簿と銀行を分ける：振出時に帳簿を減らす、銀行決済には時間差もある</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">現金と当座｜条件を順に読む</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">01 誰が振り出したか</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">他人振出を保有→現金</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">自己振出の受取→当座預金</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">02 直ちに預けたか</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">受入と預入をまとめる</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">預入先の科目で記録</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">03 帳簿と銀行を分ける</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">振出時に帳簿を減らす</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">銀行決済には時間差もある</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
