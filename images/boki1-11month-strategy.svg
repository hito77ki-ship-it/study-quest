<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">1級の11月計画｜手続と準備を分ける</title><desc id="desc">01  2026年11月15日の第174回：2026年11月2日確認：全国で受付終了、申込済みなら受験票の時刻・会場を確認。02  未申込なら演習を中間点に：次の1級施行回と、受験地の受付を確認、学習時間だけで合格や受験可否を決めない。03  結果を次の課題へ引き継ぐ：公式形式は各90分・途中に休憩あり、確認した事実と、まだ不明な点を分ける</desc>
<rect width="760" height="560" rx="18" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">1級の11月計画｜手続と準備を分ける</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">01  2026年11月15日の第174回</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">2026年11月2日確認：全国で受付終了</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">申込済みなら受験票の時刻・会場を確認</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">02  未申込なら演習を中間点に</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">次の1級施行回と、受験地の受付を確認</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">学習時間だけで合格や受験可否を決めない</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">03  結果を次の課題へ引き継ぐ</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">公式形式は各90分・途中に休憩あり</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">確認した事実と、まだ不明な点を分ける</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
