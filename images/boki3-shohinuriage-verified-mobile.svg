<title id="title">商品有高帳｜端数条件を固定</title><desc id="desc">01 先入先出の払出：100×200＋50×210＝30,500、残高150×210＝31,500。02 移動平均は丸めない：62,000÷300＝206と2/3、150個払出＝31,000。03 合計と数量を照合：300−150＝残150個、払出＋残高＝62,000</desc>
