<title id="title">経過勘定｜再振替を混ぜない</title><desc id="desc">01 期末に未収200：未収利息200／受取利息200、前期に属する利息を計上。02 期首に再振替：受取利息200／未収利息200、未収残高はゼロになる。03 受取400を計上：現金400／受取利息400、翌期収益：400−200＝200</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">経過勘定｜再振替を混ぜない</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">01 期末に未収200</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">未収利息200／受取利息200</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">前期に属する利息を計上</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">02 期首に再振替</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">受取利息200／未収利息200</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">未収残高はゼロになる</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">03 受取400を計上</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">現金400／受取利息400</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">翌期収益：400−200＝200</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
