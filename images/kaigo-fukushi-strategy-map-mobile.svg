<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 820" width="360" height="820" role="img" aria-labelledby="svgtitle svgdesc">
  <title id="svgtitle">介護福祉士国家試験の3パート、13科目、11試験科目群の関係</title><desc id="svgdesc">第39回介護福祉士国家試験の公式案内に基づく、3パートと合格基準の図解</desc>
  <defs><linearGradient id="headerM" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11372A"/><stop offset="1" stop-color="#1C5A3A"/></linearGradient></defs>
  <rect x="12" y="12" width="336" height="88" rx="14" fill="url(#headerM)"/>
  <g font-family="system-ui, sans-serif"><text x="28" y="39" fill="#C7FF49" font-size="9" font-weight="800" letter-spacing="1.2">OFFICIAL EXAM MAP / 第39回</text><text x="28" y="65" fill="#F8FAFC" font-size="16" font-weight="800">3パート・計13科目</text><text x="28" y="84" fill="#D6E4DE" font-size="12">11試験科目群と合格基準を分けて読む</text>
  <rect x="12" y="120" width="336" height="172" rx="14" fill="#102A23" stroke="#2B6650" stroke-width="1.5"/><text x="30" y="151" fill="#C7FF49" font-size="12" font-weight="800">A PART / 60点</text><text x="30" y="178" fill="#F8FAFC" font-size="15" font-weight="800">人間と社会・介護</text><text x="30" y="205" fill="#D6E4DE" font-size="11">人間の尊厳と自立 ／ 介護の基本 ／ 社会の理解</text><text x="30" y="228" fill="#D6E4DE" font-size="11">人間関係とコミュニケーション ／ コミュニケーション技術</text><text x="30" y="251" fill="#D6E4DE" font-size="11">生活支援技術</text>
  <rect x="12" y="310" width="336" height="158" rx="14" fill="#102A23" stroke="#2B6650" stroke-width="1.5"/><text x="30" y="341" fill="#C7FF49" font-size="12" font-weight="800">B PART / 45点</text><text x="30" y="368" fill="#F8FAFC" font-size="15" font-weight="800">こころとからだ・医療的ケア</text><text x="30" y="395" fill="#D6E4DE" font-size="11">こころとからだのしくみ ／ 発達と老化の理解</text><text x="30" y="418" fill="#D6E4DE" font-size="11">認知症の理解 ／ 障害の理解 ／ 医療的ケア</text>
  <rect x="12" y="486" width="336" height="110" rx="14" fill="#102A23" stroke="#2B6650" stroke-width="1.5"/><text x="30" y="517" fill="#C7FF49" font-size="12" font-weight="800">C PART / 20点</text><text x="30" y="544" fill="#F8FAFC" font-size="15" font-weight="800">介護・全領域</text><text x="30" y="570" fill="#D6E4DE" font-size="11">介護過程 ／ 総合問題　　全125問・1問1点</text>
  <rect x="12" y="616" width="336" height="192" rx="14" fill="#0D211B" stroke="#C7FF49" stroke-width="1.5"/><text x="30" y="648" fill="#C7FF49" font-size="11" font-weight="800">合格基準の確認</text><text x="30" y="678" fill="#F8FAFC" font-size="13" font-weight="800">12科目＋総合問題 ＝ 計13科目</text><text x="30" y="710" fill="#C8D9D2" font-size="10.5">全パート受験は、総得点基準に加え</text><text x="30" y="728" fill="#C8D9D2" font-size="10.5">11試験科目群すべてに得点が必要。</text><text x="30" y="758" fill="#C8D9D2" font-size="10.5">第39回からはパート別基準による</text><text x="30" y="776" fill="#C8D9D2" font-size="10.5">合格判定もある。</text><text x="30" y="797" fill="#8FD4B2" font-size="8.5">出典：社会福祉振興・試験センター（2026年9月1日確認）</text></g>
</svg>
