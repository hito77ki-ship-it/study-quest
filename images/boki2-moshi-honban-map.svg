<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">01 比較条件を揃える</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">初見・再演習・時間・解答参照</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">方式と教材年度も記録</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
