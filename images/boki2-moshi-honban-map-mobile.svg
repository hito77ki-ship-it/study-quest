<title id="title">模試の比較｜点差から原因を決めない</title><desc id="desc">01 比較条件を揃える：初見・再演習・時間・解答参照、方式と教材年度も記録。02 観測と推測を分ける：未到達か、考えて止まったか、答案で確かめられる事実を書く。03 次の練習を一つ選ぶ：未確認の原因を確かめる、条件・使った時間・結果を追記</desc>
