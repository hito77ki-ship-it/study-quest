<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">棚卸資産｜数量と単価を分ける</title><desc id="desc">01 数量不足は原価で計算：帳簿100個・実地98個、差2個×原価1,000＝2,000円。02 実在分の値下がりを計算：98個×（1,000−900）、評価損9,800円。03 期末商品を検算：98個×900＝88,200円、100,000−2,000−9,800と一致</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">棚卸資産｜数量と単価を分ける</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">01 数量不足は原価で計算</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">帳簿100個・実地98個</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">差2個×原価1,000＝2,000円</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">02 実在分の値下がりを計算</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">98個×（1,000−900）</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">評価損9,800円</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">03 期末商品を検算</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">98個×900＝88,200円</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">100,000−2,000−9,800と一致</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
