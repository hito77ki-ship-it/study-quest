<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">学習計画｜可能時間と必要量は別</title><desc id="desc">01 自分の週の予定を書く：45分×週5回＝225分、必要学習時間の統計ではない。02 使えない週を除く：12週のうち2週は使えない仮定、225分×10週＝2,250分。03 37時間30分の枠を使う：学ぶ量は演習結果で調整、受験年度と申込日程も確認</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">学習計画｜可能時間と必要量は別</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">01 自分の週の予定を書く</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">45分×週5回＝225分</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">必要学習時間の統計ではない</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">02 使えない週を除く</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">12週のうち2週は使えない仮定</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">225分×10週＝2,250分</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">03 37時間30分の枠を使う</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">学ぶ量は演習結果で調整</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">受験年度と申込日程も確認</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
