<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">債券の仕訳｜誰の帳簿かを先に確認</title><desc id="desc">01  2級：他社の債券を保有する側：資産＝満期保有目的債券、収益＝有価証券利息。02  自作例：98,000円で取得：額面100,000円、残り5年、定額法、金利調整差額2,000÷5＝年400円。03  発行側の処理は1級の範囲：発行・利払・期末評価・償還を区別、購入側で負債の「社債」を計上しない</desc>
<rect width="760" height="560" rx="18" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">債券の仕訳｜誰の帳簿かを先に確認</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">01  2級：他社の債券を保有する側</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">資産＝満期保有目的債券</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">収益＝有価証券利息</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">02  自作例：98,000円で取得</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">額面100,000円、残り5年、定額法</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">金利調整差額2,000÷5＝年400円</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">03  発行側の処理は1級の範囲</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">発行・利払・期末評価・償還を区別</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">購入側で負債の「社債」を計上しない</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
