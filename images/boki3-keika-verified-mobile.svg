<title id="title">経過勘定｜再振替を混ぜない</title><desc id="desc">01 期末に未収200：未収利息200／受取利息200、前期に属する利息を計上。02 期首に再振替：受取利息200／未収利息200、未収残高はゼロになる。03 受取400を計上：現金400／受取利息400、翌期収益：400−200＝200</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">経過勘定｜再振替を混ぜない</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">01 期末に未収200</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">未収利息200／受取利息200</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">前期に属する利息を計上</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">02 期首に再振替</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">受取利息200／未収利息200</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">未収残高はゼロになる</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
