<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="title desc">
<title id="title">IELTSの総合バンド計算と架空の技能別条件</title><desc id="desc">6.5、6.5、6.0、6.0の平均6.25は総合6.5。各技能6.0以上という架空の条件も満たす。</desc>
<style>text{font-family:'Noto Sans JP','Hiragino Sans',sans-serif}</style>
<rect x="0" y="0" width="760" height="430" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="380.0" y="28" font-size="18" fill="#1E293B" text-anchor="middle" font-weight="700">IELTS：総合と技能別条件の計算例</text>
<text x="380.0" y="50" font-size="13" fill="#1E293B" text-anchor="middle">架空例：出願先が各技能6.0以上を指定</text>
<line x1="60" y1="320" x2="720" y2="320" stroke="#CBD5E1" stroke-dasharray="5,4"/>
<text x="50" y="324" font-size="11" fill="#1E293B" text-anchor="end">0.0</text>
<line x1="60" y1="176" x2="720" y2="176" stroke="#EF4444" stroke-dasharray="5,4"/>
<text x="50" y="180" font-size="11" fill="#1E293B" text-anchor="end">6.0</text>
<line x1="60" y1="104" x2="720" y2="104" stroke="#CBD5E1" stroke-dasharray="5,4"/>
<text x="50" y="108" font-size="11" fill="#1E293B" text-anchor="end">9.0</text>
<text x="715" y="88" font-size="11" fill="#B91C1C" text-anchor="end">赤線：仮の各技能条件6.0</text>
<rect x="100" y="164.0" width="80" height="156.0" rx="10" fill="#DBEAFE" stroke="#CBD5E1"/>
<text x="140" y="152.0" font-size="14" fill="#1E293B" text-anchor="middle" font-weight="700">6.5</text>
<text x="140" y="342" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="700">Listening</text>
<rect x="270" y="164.0" width="80" height="156.0" rx="10" fill="#EDE9FE" stroke="#CBD5E1"/>
<text x="310" y="152.0" font-size="14" fill="#1E293B" text-anchor="middle" font-weight="700">6.5</text>
<text x="310" y="342" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="700">Reading</text>
<rect x="440" y="176.0" width="80" height="144.0" rx="10" fill="#FFEDD5" stroke="#CBD5E1"/>
<text x="480" y="164.0" font-size="14" fill="#1E293B" text-anchor="middle" font-weight="700">6.0</text>
<text x="480" y="342" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="700">Writing</text>
<rect x="610" y="176.0" width="80" height="144.0" rx="10" fill="#FCE7F3" stroke="#CBD5E1"/>
<text x="650" y="164.0" font-size="14" fill="#1E293B" text-anchor="middle" font-weight="700">6.0</text>
<text x="650" y="342" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="700">Speaking</text>
<rect x="30" y="358" width="700" height="52" rx="10" fill="#FEF3C7" stroke="#CBD5E1"/>
<text x="380.0" y="379" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="700">平均6.25 → 総合6.5。図の4技能は仮の条件6.0以上も満たします。</text>
<text x="380.0" y="398" font-size="11" fill="#1E293B" text-anchor="middle">全受験者共通の合格点ではありません。指定は提出先ごとに確認。</text>
<text x="380.0" y="425" font-size="9" fill="#1E293B" text-anchor="middle">出典：IELTS「Scoring in detail」／2026年10月31日確認</text>
</svg>
