<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">税効果｜現金と期間配分を分ける</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">01 1期目の一時差異100,000</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">当期税額180,000−調整30,000</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">税金費用150,000／資産30,000</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
