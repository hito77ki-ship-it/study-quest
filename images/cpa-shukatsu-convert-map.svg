<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img"><title>受験経験を応募先へ伝える整理</title><style>text{font-family:system-ui,-apple-system,sans-serif}</style>
<text x="20" y="30" fill="#739b4b" font-size="19" font-weight="700">受験経験を応募先へ伝える整理</text>
<rect x="20" y="65" width="230" height="160" rx="8" fill="#14211d" stroke="#739b4b" stroke-width="1.5"/>
<text x="34" y="93" fill="#bddb91" font-size="15" font-weight="700">1　事実</text>
<text x="34" y="118" fill="#c6d7c9" font-size="13">実際に学んだ範囲</text>
<text x="34" y="141" fill="#c6d7c9" font-size="13">方向転換した理由</text>
<text x="34" y="164" fill="#c6d7c9" font-size="13">未取得資格と取得済みを区別</text>
<text x="253" y="150" fill="#739b4b" font-size="18">→</text>
<rect x="266" y="65" width="230" height="160" rx="8" fill="#14211d" stroke="#739b4b" stroke-width="1.5"/>
<text x="280" y="93" fill="#bddb91" font-size="15" font-weight="700">2　証拠</text>
<text x="280" y="118" fill="#c6d7c9" font-size="13">復習メモ・成果物</text>
<text x="280" y="141" fill="#c6d7c9" font-size="13">実際に残っている記録</text>
<text x="280" y="164" fill="#c6d7c9" font-size="13">存在しない経験を加えない</text>
<text x="499" y="150" fill="#739b4b" font-size="18">→</text>
<rect x="512" y="65" width="230" height="160" rx="8" fill="#14211d" stroke="#739b4b" stroke-width="1.5"/>
<text x="526" y="93" fill="#bddb91" font-size="15" font-weight="700">3　応募先との接点</text>
<text x="526" y="118" fill="#c6d7c9" font-size="13">募集要項の業務を確認</text>
<text x="526" y="141" fill="#c6d7c9" font-size="13">知識と実務経験を区別</text>
<text x="526" y="164" fill="#c6d7c9" font-size="13">次に学ぶことを整理</text>
<rect x="12" y="242" width="736" height="70" rx="8" fill="#14211d"/><text x="18" y="265" fill="#c6d7c9" font-size="13">編集部の整理案です。本人の経歴・採用実績ではありません。</text>
<text x="18" y="287" fill="#c6d7c9" font-size="13">質問内容・評価は応募先により異なり、即戦力や採用結果を保証しません。</text></svg>
