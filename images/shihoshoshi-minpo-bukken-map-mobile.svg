<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">根抵当権｜時点と動きを分ける</title><desc id="desc">01  元本確定前かを先に確認：一時的な残高0と元本確定は別、一定範囲の不特定債権を担保（398条の2）。02  発生・消滅の関係＝付従性：継続取引中、一時的な残高0だけで、根抵当権が当然に消滅するとはしない。03  債権移転の関係＝随伴性：確定前の債権取得者は、その債権につき、根抵当権を行使できない（398条の7）</desc>
<rect width="390" height="660" rx="18" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">根抵当権｜時点と動きを分ける</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="14" font-weight="700" fill="#B6E27C">01  元本確定前かを先に確認</text>
<text x="34" y="165" font-size="13" fill="#F0F6ED">一時的な残高0と元本確定は別</text>
<text x="34" y="193" font-size="13" fill="#F0F6ED">一定範囲の不特定債権を担保（398条の2）</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="14" font-weight="700" fill="#B6E27C">02  発生・消滅の関係＝付従性</text>
<text x="34" y="339" font-size="13" fill="#F0F6ED">継続取引中、一時的な残高0だけで</text>
<text x="34" y="367" font-size="13" fill="#F0F6ED">根抵当権が当然に消滅するとはしない</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="14" font-weight="700" fill="#B6E27C">03  債権移転の関係＝随伴性</text>
<text x="34" y="513" font-size="13" fill="#F0F6ED">確定前の債権取得者は、その債権につき</text>
<text x="34" y="541" font-size="13" fill="#F0F6ED">根抵当権を行使できない（398条の7）</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件の詳細・一次資料・自作例題の解答は本文へ</text></g></svg>
