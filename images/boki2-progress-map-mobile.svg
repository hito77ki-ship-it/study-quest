<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">読了と習熟｜同じ割合にしない</title><desc id="desc">01 このページの掲載数は33記事：全出題範囲の項目数ではない、チェックはブラウザに保存。02 11記事なら読了率は約33%：11÷33×100を四捨五入、得点率や理解率とは別。03 自力で解けるかを別に記録：条件・仕訳・集計を確かめる、次の復習対象を一つ選ぶ</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">読了と習熟｜同じ割合にしない</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">01 このページの掲載数は33記事</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">全出題範囲の項目数ではない</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">チェックはブラウザに保存</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">02 11記事なら読了率は約33%</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">11÷33×100を四捨五入</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">得点率や理解率とは別</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">03 自力で解けるかを別に記録</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">条件・仕訳・集計を確かめる</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">次の復習対象を一つ選ぶ</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
