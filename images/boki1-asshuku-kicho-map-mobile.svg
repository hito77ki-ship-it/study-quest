<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">圧縮記帳｜会計と税務の差を追う</title><desc id="desc">01  自作例：単位は万円：機械900、補助金600、仮定の税率40％、適用要件を満たす・償却前という前提。02  直接減額方式：機械900−圧縮600＝帳簿価額300、圧縮損は利益へ影響。積立金への振替なし。03  積立金方式：機械900・税務300→差600、繰延税金負債240・圧縮積立金360</desc>
<rect width="390" height="660" rx="18" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">圧縮記帳｜会計と税務の差を追う</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="14" font-weight="700" fill="#B6E27C">01  自作例：単位は万円</text>
<text x="34" y="165" font-size="13" fill="#F0F6ED">機械900、補助金600、仮定の税率40％</text>
<text x="34" y="193" font-size="13" fill="#F0F6ED">適用要件を満たす・償却前という前提</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="14" font-weight="700" fill="#B6E27C">02  直接減額方式</text>
<text x="34" y="339" font-size="13" fill="#F0F6ED">機械900−圧縮600＝帳簿価額300</text>
<text x="34" y="367" font-size="13" fill="#F0F6ED">圧縮損は利益へ影響。積立金への振替なし</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="14" font-weight="700" fill="#B6E27C">03  積立金方式</text>
<text x="34" y="513" font-size="13" fill="#F0F6ED">機械900・税務300→差600</text>
<text x="34" y="541" font-size="13" fill="#F0F6ED">繰延税金負債240・圧縮積立金360</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
