<title id="title">製造原価｜仕掛品と製品を区別</title><desc id="desc">01 当月製造費用120,000円：直接材料50,000・労務40,000、直接経費0・間接費配賦30,000。02 完成して製品へ112,000円：120,000＋月初15,000、−月末20,000−他勘定3,000。03 売上原価へつなぐ：製品5,000＋112,000−20,000、差異2,000加算の指定なら99,000</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">製造原価｜仕掛品と製品を区別</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">01 当月製造費用120,000円</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">直接材料50,000・労務40,000</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">直接経費0・間接費配賦30,000</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">02 完成して製品へ112,000円</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">120,000＋月初15,000</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">−月末20,000−他勘定3,000</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">03 売上原価へつなぐ</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">製品5,000＋112,000−20,000</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">差異2,000加算の指定なら99,000</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
