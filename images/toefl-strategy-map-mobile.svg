<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" width="360" height="720" role="img" aria-labelledby="title desc">
<title id="title">TOEFL iBTの総合・技能別条件の架空例</title><desc id="desc">各技能4.0以上という架空の出願条件。5.0、5.0、3.5、4.0の平均は4.375、総合は4.5。Speakingは仮の条件未満。</desc>
<style>text{font-family:'Noto Sans JP','Hiragino Sans',sans-serif}</style>
<rect x="0" y="0" width="360" height="720" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="180.0" y="30" font-size="13" fill="#1E293B" text-anchor="middle" font-weight="700">TOEFL iBT：総合と技能別の条件</text>
<text x="180.0" y="52" font-size="10" fill="#1E293B" text-anchor="middle">現行1〜6尺度／出願条件は提出先が指定</text>
<rect x="16" y="72" width="328" height="80" rx="10" fill="#DBEAFE" stroke="#CBD5E1"/>
<text x="180.0" y="98" font-size="12" fill="#1E293B" text-anchor="middle" font-weight="700">架空例：各技能4.0以上を指定</text>
<text x="180.0" y="123" font-size="10.5" fill="#1E293B" text-anchor="middle">ETS共通の合格点ではありません</text>
<rect x="16" y="170" width="328" height="74" rx="10" fill="#DBEAFE" stroke="#CBD5E1"/>
<text x="30" y="197" font-size="13" fill="#1E293B" text-anchor="start" font-weight="700">Reading</text>
<text x="324" y="197" font-size="13" fill="#1E293B" text-anchor="end" font-weight="700">5.0 / 6.0</text>
<text x="30" y="223" font-size="11" fill="#334155" text-anchor="start">仮の条件4.0以上を満たす</text>
<rect x="16" y="258" width="328" height="74" rx="10" fill="#DCFCE7" stroke="#CBD5E1"/>
<text x="30" y="285" font-size="13" fill="#1E293B" text-anchor="start" font-weight="700">Listening</text>
<text x="324" y="285" font-size="13" fill="#1E293B" text-anchor="end" font-weight="700">5.0 / 6.0</text>
<text x="30" y="311" font-size="11" fill="#334155" text-anchor="start">仮の条件4.0以上を満たす</text>
<rect x="16" y="346" width="328" height="74" rx="10" fill="#FEE2E2" stroke="#CBD5E1"/>
<text x="30" y="373" font-size="13" fill="#1E293B" text-anchor="start" font-weight="700">Speaking</text>
<text x="324" y="373" font-size="13" fill="#1E293B" text-anchor="end" font-weight="700">3.5 / 6.0</text>
<text x="30" y="399" font-size="11" fill="#B91C1C" text-anchor="start">仮の条件4.0以上を満たさない</text>
<rect x="16" y="434" width="328" height="74" rx="10" fill="#EDE9FE" stroke="#CBD5E1"/>
<text x="30" y="461" font-size="13" fill="#1E293B" text-anchor="start" font-weight="700">Writing</text>
<text x="324" y="461" font-size="13" fill="#1E293B" text-anchor="end" font-weight="700">4.0 / 6.0</text>
<text x="30" y="487" font-size="11" fill="#334155" text-anchor="start">仮の条件4.0以上を満たす</text>
<rect x="16" y="544" width="328" height="154" rx="10" fill="#FEF3C7" stroke="#CBD5E1"/>
<text x="180.0" y="572" font-size="13" fill="#1E293B" text-anchor="middle" font-weight="700">平均4.375 → 総合4.5</text>
<text x="30" y="602" font-size="11" fill="#1E293B" text-anchor="start">総合が4.5でもSpeakingは3.5。</text>
<text x="30" y="625" font-size="11" fill="#1E293B" text-anchor="start">この架空の技能別条件には届きません。</text>
<text x="30" y="651" font-size="11" fill="#1E293B" text-anchor="start">総合条件・技能別条件を別々に確認。</text>
<text x="30" y="678" font-size="9.5" fill="#1E293B" text-anchor="start">出典：ETS／2026年10月31日確認</text>
</svg>
