<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
<title id="title">ノート1冊を仕入れて販売する仮定例</title><desc id="desc">100円で仕入れたノート1冊を150円で販売。売上総利益50円は他の費用や税金を差し引く前。</desc>
<g font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif" fill="#68816d">
<text x="380" y="33" font-size="20" text-anchor="middle" font-weight="700">お店の取引：商品1冊の売上総利益を考える</text>
<text x="380" y="61" font-size="14" text-anchor="middle">説明用の仮定：仕入れたノート1冊を販売し、在庫には残らない</text>
<rect x="24" y="88" width="196" height="91" rx="12" fill="none" stroke="#7da05e" stroke-width="1.5"/>
<text x="122" y="119" font-size="19" text-anchor="middle" font-weight="700">仕入れ先</text>
<text x="122" y="151" font-size="14" text-anchor="middle">商品を仕入れる</text>
<rect x="282" y="88" width="196" height="91" rx="12" fill="none" stroke="#7da05e" stroke-width="1.5"/>
<text x="380" y="119" font-size="19" text-anchor="middle" font-weight="700">お店</text>
<text x="380" y="151" font-size="14" text-anchor="middle">仕入原価100円</text>
<rect x="540" y="88" width="196" height="91" rx="12" fill="none" stroke="#7da05e" stroke-width="1.5"/>
<text x="638" y="119" font-size="19" text-anchor="middle" font-weight="700">お客さん</text>
<text x="638" y="151" font-size="14" text-anchor="middle">売値150円</text>
<path d="M226 134h40m-9-7 9 7-9 7" fill="none" stroke="#7da05e" stroke-width="2"/>
<path d="M484 134h40m-9-7 9 7-9 7" fill="none" stroke="#7da05e" stroke-width="2"/>
<rect x="24" y="203" width="712" height="90" rx="12" fill="none" stroke="#7da05e" stroke-width="1.5"/>
<text x="380" y="234" font-size="19" text-anchor="middle" font-weight="700">売上高150円 − 売上原価100円 ＝ 売上総利益50円</text>
<text x="380" y="266" font-size="14" text-anchor="middle">家賃・人件費・税金などを差し引いた最終利益とは区別する</text>
<text x="380" y="323" font-size="14" text-anchor="middle">売れ残った商品は在庫。仕入れた全額が当期の売上原価とは限らない</text>
<text x="380" y="352" font-size="14" text-anchor="middle">簿記は取引を記録・計算・整理し、経営成績と財政状態を示す</text>
</g></svg>
