<title id="title">直接原価｜利益差を在庫で検算</title><desc id="desc">01  自作例：100個生産・80個販売：全部原価の営業利益6,000円、直接原価の営業利益−6,000円。02  期末20個に残る固定製造費：1個600円×20個＝12,000円、−6,000＋12,000＝6,000円で一致。03  翌期に在庫を売り切る例：翌期利益：全部4,000・直接16,000円、2期合計は両方法とも10,000円</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">直接原価｜利益差を在庫で検算</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">01  自作例：100個生産・80個販売</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">全部原価の営業利益6,000円</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">直接原価の営業利益−6,000円</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">02  期末20個に残る固定製造費</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">1個600円×20個＝12,000円</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">−6,000＋12,000＝6,000円で一致</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">03  翌期に在庫を売り切る例</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">翌期利益：全部4,000・直接16,000円</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">2期合計は両方法とも10,000円</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
