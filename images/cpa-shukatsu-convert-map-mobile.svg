<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 490" width="360" height="490" role="img"><title>受験経験を応募先へ伝える整理</title><style>text{font-family:system-ui,-apple-system,sans-serif}</style>
<text x="20" y="30" fill="#739b4b" font-size="19" font-weight="700">受験経験を応募先へ伝える整理</text>
<rect x="16" y="55" width="328" height="98" rx="8" fill="#14211d" stroke="#739b4b" stroke-width="1.5"/>
<text x="30" y="83" fill="#bddb91" font-size="15" font-weight="700">1　事実</text>
<text x="30" y="105" fill="#c6d7c9" font-size="13">実際に学んだ範囲</text>
<text x="30" y="125" fill="#c6d7c9" font-size="13">方向転換した理由</text>
<text x="30" y="145" fill="#c6d7c9" font-size="13">未取得資格と取得済みを区別</text>
<text x="180.0" y="169" fill="#739b4b" font-size="18">↓</text>
<rect x="16" y="173" width="328" height="98" rx="8" fill="#14211d" stroke="#739b4b" stroke-width="1.5"/>
<text x="30" y="201" fill="#bddb91" font-size="15" font-weight="700">2　証拠</text>
<text x="30" y="223" fill="#c6d7c9" font-size="13">復習メモ・成果物</text>
<text x="30" y="243" fill="#c6d7c9" font-size="13">実際に残っている記録</text>
<text x="30" y="263" fill="#c6d7c9" font-size="13">存在しない経験を加えない</text>
<text x="180.0" y="287" fill="#739b4b" font-size="18">↓</text>
<rect x="16" y="291" width="328" height="98" rx="8" fill="#14211d" stroke="#739b4b" stroke-width="1.5"/>
<text x="30" y="319" fill="#bddb91" font-size="15" font-weight="700">3　応募先との接点</text>
<text x="30" y="341" fill="#c6d7c9" font-size="13">募集要項の業務を確認</text>
<text x="30" y="361" fill="#c6d7c9" font-size="13">知識と実務経験を区別</text>
<text x="30" y="381" fill="#c6d7c9" font-size="13">次に学ぶことを整理</text>
<rect x="12" y="414" width="336" height="64" rx="8" fill="#14211d"/><text x="18" y="440" fill="#c6d7c9" font-size="11">編集部の整理案。経歴や採用実績ではありません。</text>
<text x="18" y="461" fill="#c6d7c9" font-size="11">応募先の質問・評価や採用結果は保証しません。</text></svg>
