<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1180" viewBox="0 0 360 1180" role="img" aria-labelledby="svgtitle svgdesc">
  <title id="svgtitle">税理士の簿記論・財務諸表論と日商簿記1級の受験条件比較（モバイル版）</title>
  <desc id="svgdesc">税理士試験の簿記論・財務諸表論と日商簿記1級について、受験資格、試験形式、税法科目との関係を縦に比較する図解</desc>
  <defs>
    <linearGradient id="zbmBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7FAFC"/>
      <stop offset="1" stop-color="#F0FFF4"/>
    </linearGradient>
    <linearGradient id="zbmTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#2D4A10"/>
    </linearGradient>
    <linearGradient id="zbmHigh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8CC63F"/>
      <stop offset="1" stop-color="#6AAF2B"/>
    </linearGradient>
    <linearGradient id="zbmMid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <style>.zt{font-family:"Noto Sans JP",system-ui,sans-serif}</style>
  </defs>

  <rect width="360" height="1180" rx="18" fill="url(#zbmBg)"/>

  <!-- Title -->
  <rect x="16" y="20" width="328" height="66" rx="12" fill="url(#zbmTitle)"/>
  <text x="180" y="42" text-anchor="middle" class="zt" font-size="9.5" font-weight="700" fill="#A0C070" letter-spacing="1">受験資格と試験形式の比較</text>
  <text x="180" y="60" text-anchor="middle" class="zt" font-size="12.5" font-weight="800" fill="#FFFFFF">税理士（簿財）と簿記1級、</text>
  <text x="180" y="78" text-anchor="middle" class="zt" font-size="12.5" font-weight="800" fill="#FFFFFF">先に確認する条件</text>

  <!-- Hub card -->
  <rect x="20" y="100" width="320" height="98" rx="14" fill="#FFFFFF" stroke="#8CC63F" stroke-width="2"/>
  <text x="180" y="126" text-anchor="middle" class="zt" font-size="13" font-weight="800" fill="#1A202C">最初に分けて確認すること</text>
  <text x="180" y="148" text-anchor="middle" class="zt" font-size="10.5" fill="#374151">簿財だけを受けるか／</text>
  <text x="180" y="164" text-anchor="middle" class="zt" font-size="10.5" fill="#374151">税法科目まで進むか</text>
  <text x="180" y="186" text-anchor="middle" class="zt" font-size="10.5" font-weight="700" fill="#6AAF2B">↓ 条件が違う2つの試験を比べる</text>

  <!-- 税理士カード -->
  <rect x="20" y="214" width="320" height="330" rx="16" fill="#FDF2F8" stroke="#F472B6" stroke-width="2"/>
  <rect x="20" y="214" width="320" height="46" rx="16" fill="#F472B6"/>
  <rect x="20" y="244" width="320" height="16" fill="#F472B6"/>
  <text x="180" y="243" text-anchor="middle" class="zt" font-size="12.5" font-weight="800" fill="#FFFFFF">📘 税理士 簿記論・財務諸表論</text>

  <text x="38" y="284" class="zt" font-size="11" font-weight="700" fill="#9D174D">確認する受験条件</text>
  <text x="38" y="306" class="zt" font-size="11.5" fill="#374151">受験資格：制限なし</text>
  <text x="38" y="324" class="zt" font-size="11" fill="#374151">簿財だけなら資格証明書は不要</text>
  <text x="38" y="354" class="zt" font-size="11" font-weight="700" fill="#9D174D">税理士試験での位置づけ</text>
  <text x="38" y="376" class="zt" font-size="11" fill="#374151">会計学2科目。科目合格制</text>
  <text x="38" y="394" class="zt" font-size="11" fill="#374151">税法科目だけ別の要件を確認</text>

  <rect x="38" y="486" width="284" height="40" rx="14" fill="#9D174D"/>
  <text x="180" y="506" text-anchor="middle" class="zt" font-size="11" font-weight="700" fill="#fff">受けたい科目と</text>
  <text x="180" y="520" text-anchor="middle" class="zt" font-size="11" font-weight="700" fill="#fff">公式日程を確認</text>

  <!-- 簿記1級カード -->
  <rect x="20" y="564" width="320" height="380" rx="16" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <rect x="20" y="564" width="320" height="58" rx="16" fill="#3B82F6"/>
  <rect x="20" y="606" width="320" height="16" fill="#3B82F6"/>
  <text x="180" y="588" text-anchor="middle" class="zt" font-size="12.5" font-weight="800" fill="#FFFFFF">📗 日商簿記1級</text>
  <text x="180" y="606" text-anchor="middle" class="zt" font-size="11" font-weight="700" fill="#FFFFFF">（商業・会計学／工業・原価計算）</text>

  <text x="38" y="646" class="zt" font-size="11" font-weight="700" fill="#1E40AF">試験形式</text>
  <text x="38" y="666" class="zt" font-size="11" fill="#374151">商業簿記・会計学</text>
  <text x="38" y="682" class="zt" font-size="11" fill="#374151">工業簿記・原価計算</text>
  <text x="38" y="712" class="zt" font-size="11" fill="#374151">各90分の2つの時間帯を通して受験</text>
  <text x="38" y="748" class="zt" font-size="11" font-weight="700" fill="#1E40AF">合格基準・日程</text>
  <text x="38" y="766" class="zt" font-size="11" fill="#374151">総点70%以上、かつ各科目40%以上</text>
  <text x="38" y="784" class="zt" font-size="11" fill="#374151">2026年度：6月14日・11月15日</text>
  <text x="38" y="814" class="zt" font-size="11" font-weight="700" fill="#1E40AF">税法科目の要件との関係</text>
  <text x="38" y="832" class="zt" font-size="11" fill="#374151">日商簿記1級合格は、資格要件を</text>
  <text x="38" y="850" class="zt" font-size="11" fill="#374151">満たす方法の一つ</text>

  <rect x="38" y="862" width="284" height="52" rx="14" fill="#1E40AF"/>
  <text x="180" y="884" text-anchor="middle" class="zt" font-size="11" font-weight="700" fill="#fff">試験形式と必要な要件を</text>
  <text x="180" y="900" text-anchor="middle" class="zt" font-size="11" font-weight="700" fill="#fff">それぞれ確認</text>

  <!-- Bottom summary bar -->
  <rect x="16" y="962" width="328" height="200" rx="16" fill="#111827"/>
  <text x="180" y="990" text-anchor="middle" class="zt" font-size="12.5" font-weight="700" fill="#8CC63F">選択前の確認順</text>
  <text x="180" y="1016" text-anchor="middle" class="zt" font-size="10.5" fill="#E5E7EB">① 簿財だけを受ける</text>
  <text x="180" y="1034" text-anchor="middle" class="zt" font-size="10.5" fill="#E5E7EB">→ 受験資格なし。税法の要件と混同しない</text>
  <text x="180" y="1080" text-anchor="middle" class="zt" font-size="10.5" fill="#E5E7EB">② 税法まで進む</text>
  <text x="180" y="1098" text-anchor="middle" class="zt" font-size="10.5" fill="#E5E7EB">→ 自分の要件を確認</text>
  <text x="180" y="1116" text-anchor="middle" class="zt" font-size="10.5" fill="#E5E7EB">日商簿記1級は満たす方法の一つ</text>
</svg>
