<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">総合償却｜条件と端数をそろえる</title><desc id="desc">01  自作例の個別年額：A：1,350円、B：600円、償却可能額9,000円、年額合計1,950円。02  平均年数を丸めない場合：9,000÷1,950＝60/13年、9,000÷(60/13)＝1,950円で一致。03  問題が年数切捨てを指定したら：この練習では4年：年額2,250円、年数の丸めによる差額は300円</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">総合償却｜条件と端数をそろえる</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="13" font-weight="700" fill="#B6E27C">01  自作例の個別年額</text>
<text x="34" y="165" font-size="12" fill="#F0F6ED">A：1,350円、B：600円</text>
<text x="34" y="193" font-size="12" fill="#F0F6ED">償却可能額9,000円、年額合計1,950円</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="13" font-weight="700" fill="#B6E27C">02  平均年数を丸めない場合</text>
<text x="34" y="339" font-size="12" fill="#F0F6ED">9,000÷1,950＝60/13年</text>
<text x="34" y="367" font-size="12" fill="#F0F6ED">9,000÷(60/13)＝1,950円で一致</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="13" font-weight="700" fill="#B6E27C">03  問題が年数切捨てを指定したら</text>
<text x="34" y="513" font-size="12" fill="#F0F6ED">この練習では4年：年額2,250円</text>
<text x="34" y="541" font-size="12" fill="#F0F6ED">年数の丸めによる差額は300円</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
