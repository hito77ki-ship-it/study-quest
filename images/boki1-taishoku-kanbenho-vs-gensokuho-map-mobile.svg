<title id="title">退職給付｜支払元と3列の増減</title><desc id="desc">01  自作例：差異の費用処理なし：勤務6,000＋利息2,000−期待収益2,400、当期費用は5,600円、掛金とは別。02  会社が直接1,000円を給付：期末債務107,000、年金資産86,400、差引の引当金20,600円。03  基金が1,000円を給付に変えると：期末債務107,000、年金資産85,400、差引の引当金21,600円</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">退職給付｜支払元と3列の増減</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="13" font-weight="700" fill="#B6E27C">01  自作例：差異の費用処理なし</text>
<text x="34" y="165" font-size="12" fill="#F0F6ED">勤務6,000＋利息2,000−期待収益2,400</text>
<text x="34" y="193" font-size="12" fill="#F0F6ED">当期費用は5,600円、掛金とは別</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="13" font-weight="700" fill="#B6E27C">02  会社が直接1,000円を給付</text>
<text x="34" y="339" font-size="12" fill="#F0F6ED">期末債務107,000、年金資産86,400</text>
<text x="34" y="367" font-size="12" fill="#F0F6ED">差引の引当金20,600円</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="13" font-weight="700" fill="#B6E27C">03  基金が1,000円を給付に変えると</text>
<text x="34" y="513" font-size="12" fill="#F0F6ED">期末債務107,000、年金資産85,400</text>
<text x="34" y="541" font-size="12" fill="#F0F6ED">差引の引当金21,600円</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
