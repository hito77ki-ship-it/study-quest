<title id="title">簿記1級｜申込・年度・演習の確認</title><desc id="desc">01  2026年11月2日の確認：第174回11月15日は全国で受付終了、第175回2月28日は2・3級のみ。02  受験年度と教材の版を照合：2026年度は2027年3月31日まで、2027年度の確定版と混同しない。03  3段階を進捗に合わせて使う：全体像→問題で確認→本番形式で測る、本番形式：各90分、途中に休憩あり</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">簿記1級｜申込・年度・演習の確認</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="13" font-weight="700" fill="#B6E27C">01  2026年11月2日の確認</text>
<text x="34" y="165" font-size="12" fill="#F0F6ED">第174回11月15日は全国で受付終了</text>
<text x="34" y="193" font-size="12" fill="#F0F6ED">第175回2月28日は2・3級のみ</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="13" font-weight="700" fill="#B6E27C">02  受験年度と教材の版を照合</text>
<text x="34" y="339" font-size="12" fill="#F0F6ED">2026年度は2027年3月31日まで</text>
<text x="34" y="367" font-size="12" fill="#F0F6ED">2027年度の確定版と混同しない</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="13" font-weight="700" fill="#B6E27C">03  3段階を進捗に合わせて使う</text>
<text x="34" y="513" font-size="12" fill="#F0F6ED">全体像→問題で確認→本番形式で測る</text>
<text x="34" y="541" font-size="12" fill="#F0F6ED">本番形式：各90分、途中に休憩あり</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
