<svg xmlns="http://www.w3.org/2000/svg" width="360" height="740" viewBox="0 0 360 740" role="img" aria-labelledby="title desc">
<title id="title">簿記2級とFP2級：学ぶ内容と選ぶ順番</title><desc id="desc">範囲と受検資格から、自分の目的に合う順番を選ぶ。</desc>
<g font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif" fill="#68816d">
<text x="180" y="32" font-size="21" text-anchor="middle" font-weight="700">簿記2級とFP2級</text>
<text x="180" y="59" font-size="15" text-anchor="middle">目的と受検資格から順番を選ぶ</text>
<rect x="16" y="83" width="328" height="225" rx="12" fill="none" stroke="#7da05e" stroke-width="1.5"/>
<text x="32" y="115" font-size="19" text-anchor="start" font-weight="700">日商簿記2級</text>
<text x="32" y="148" font-size="14" text-anchor="start">会社の取引・決算を記録する</text>
<text x="32" y="178" font-size="14" text-anchor="start">商業簿記と工業簿記</text>
<text x="32" y="208" font-size="14" text-anchor="start">連結会計・原価計算などを学ぶ</text>
<text x="32" y="238" font-size="14" text-anchor="start">受検資格に制限なし</text>
<text x="32" y="268" font-size="14" text-anchor="start">3級の基本を理解しているか確認</text>
<rect x="16" y="330" width="328" height="225" rx="12" fill="none" stroke="#7da05e" stroke-width="1.5"/>
<text x="32" y="362" font-size="19" text-anchor="start" font-weight="700">FP2級（日本FP協会）</text>
<text x="32" y="395" font-size="14" text-anchor="start">生活設計・保険・金融を学ぶ</text>
<text x="32" y="425" font-size="14" text-anchor="start">税金・不動産・相続等も対象</text>
<text x="32" y="455" font-size="14" text-anchor="start">学科と実技の両方に合格する</text>
<text x="32" y="485" font-size="14" text-anchor="start">受検資格を先に確認する</text>
<text x="32" y="515" font-size="14" text-anchor="start">税法・評価の条件は別途学ぶ</text>
<rect x="16" y="580" width="328" height="139" rx="12" fill="none" stroke="#7da05e" stroke-width="1.5"/>
<text x="180" y="609" font-size="14" text-anchor="middle">会計処理と税務は別のルール</text>
<text x="180" y="638" font-size="14" text-anchor="middle">全員共通の順番や効果を保証しない</text>
<text x="180" y="667" font-size="14" text-anchor="middle">使う目的から、次の問題を選ぶ</text>
<text x="180" y="698" font-size="12" text-anchor="middle">公式の範囲を照合／選び方は編集部案</text>
</g></svg>
