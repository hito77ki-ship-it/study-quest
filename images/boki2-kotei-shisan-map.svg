<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">固定資産｜売却時点の残高で比べる</title><desc id="desc">01 取得原価と期首累計：取得600,000／期首累計240,000、年間120,000円を4か月分償却。02 当期の償却を加える：当期費用40,000／累計280,000、売却時の帳簿価額320,000円。03 処分対価と比較する：売却対価250,000円、320,000−250,000＝損70,000円</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">固定資産｜売却時点の残高で比べる</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">01 取得原価と期首累計</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">取得600,000／期首累計240,000</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">年間120,000円を4か月分償却</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">02 当期の償却を加える</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">当期費用40,000／累計280,000</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">売却時の帳簿価額320,000円</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">03 処分対価と比較する</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">売却対価250,000円</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">320,000−250,000＝損70,000円</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
