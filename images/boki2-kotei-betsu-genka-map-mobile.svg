<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">工程別原価｜二つの仕掛品を残す</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">01 第1工程で分ける</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">投入1,350,000円のうち</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">次工程1,200,000／仕掛品150,000</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">02 第2工程でも分ける</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">加工費550,000円を追加</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">完成1,500,000／仕掛品250,000</text>
