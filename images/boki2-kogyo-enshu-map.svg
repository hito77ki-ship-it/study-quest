<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">01 月末20個・加工50％</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">材料は始点で全量投入済み</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">材料の換算20個／加工は10個</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
