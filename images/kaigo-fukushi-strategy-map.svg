<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="svgtitle svgdesc">
  <title id="svgtitle">介護福祉士国家試験の3パート、13科目、11試験科目群の関係</title>
  <desc id="svgdesc">第39回介護福祉士国家試験の公式案内に基づき、A・B・Cの3パートと、計13科目、合格判定に使う11試験科目群の関係を示す図解</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11372A"/><stop offset="1" stop-color="#1C5A3A"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#061B14" flood-opacity=".24"/></filter>
  </defs>
  <rect x="24" y="24" width="1152" height="92" rx="18" fill="url(#header)" filter="url(#shadow)"/>
  <text x="64" y="62" fill="#C7FF49" font-size="13" font-family="system-ui, sans-serif" font-weight="800" letter-spacing="2">OFFICIAL EXAM MAP / 第39回</text>
  <text x="64" y="94" fill="#F8FAFC" font-size="25" font-family="system-ui, sans-serif" font-weight="800">3パート・計13科目と、11試験科目群の関係</text>
  <text x="30" y="156" fill="#C7FF49" font-size="13" font-family="system-ui, sans-serif" font-weight="800" letter-spacing="1">STEP 1　出題は A・B・C の3パート</text>
  <g filter="url(#shadow)">
    <rect x="24" y="176" width="368" height="292" rx="16" fill="#102A23" stroke="#2B6650" stroke-width="2"/>
    <rect x="416" y="176" width="368" height="292" rx="16" fill="#102A23" stroke="#2B6650" stroke-width="2"/>
    <rect x="808" y="176" width="368" height="292" rx="16" fill="#102A23" stroke="#2B6650" stroke-width="2"/>
  </g>
  <g font-family="system-ui, sans-serif">
    <text x="54" y="218" fill="#C7FF49" font-size="15" font-weight="800">A PART / 60点</text><text x="54" y="249" fill="#F8FAFC" font-size="18" font-weight="800">人間と社会・介護</text><text x="54" y="284" fill="#D6E4DE" font-size="13">人間の尊厳と自立 ／ 介護の基本</text><text x="54" y="310" fill="#D6E4DE" font-size="13">社会の理解</text><text x="54" y="336" fill="#D6E4DE" font-size="13">人間関係とコミュニケーション</text><text x="54" y="362" fill="#D6E4DE" font-size="13">コミュニケーション技術</text><text x="54" y="388" fill="#D6E4DE" font-size="13">生活支援技術</text>
    <text x="446" y="218" fill="#C7FF49" font-size="15" font-weight="800">B PART / 45点</text><text x="446" y="249" fill="#F8FAFC" font-size="18" font-weight="800">こころとからだ・医療的ケア</text><text x="446" y="284" fill="#D6E4DE" font-size="13">こころとからだのしくみ</text><text x="446" y="310" fill="#D6E4DE" font-size="13">発達と老化の理解</text><text x="446" y="336" fill="#D6E4DE" font-size="13">認知症の理解</text><text x="446" y="362" fill="#D6E4DE" font-size="13">障害の理解</text><text x="446" y="388" fill="#D6E4DE" font-size="13">医療的ケア</text>
    <text x="838" y="218" fill="#C7FF49" font-size="15" font-weight="800">C PART / 20点</text><text x="838" y="249" fill="#F8FAFC" font-size="18" font-weight="800">介護・全領域</text><text x="838" y="284" fill="#D6E4DE" font-size="13">介護過程</text><text x="838" y="310" fill="#D6E4DE" font-size="13">総合問題</text><text x="838" y="352" fill="#8FD4B2" font-size="13">全125問・1問1点</text><text x="838" y="378" fill="#8FD4B2" font-size="13">午前：A ／ 午後：B・C</text>
  </g>
  <rect x="24" y="498" width="1152" height="198" rx="18" fill="#0D211B" stroke="#C7FF49" stroke-width="2"/>
  <g font-family="system-ui, sans-serif"><text x="54" y="538" fill="#C7FF49" font-size="13" font-weight="800" letter-spacing="1">STEP 2　数字の意味を分けて合格基準を確認する</text><text x="54" y="578" fill="#F8FAFC" font-size="18" font-weight="800">出題：12科目＋総合問題1科目 ＝ 計13科目</text><text x="54" y="609" fill="#C8D9D2" font-size="14">全パート受験の合格判定：総得点の60％程度を基準に難易度で補正 ＋ 11試験科目群すべてに得点</text><text x="54" y="640" fill="#C8D9D2" font-size="14">第39回から：パートごとの基準をすべて満たす場合にも合格。パート合格は翌々年まで有効。</text><text x="54" y="673" fill="#8FD4B2" font-size="12">出典：公益財団法人 社会福祉振興・試験センター「令和8年度 第39回介護福祉士国家試験」「介護福祉士国家試験 合格基準」（2026年9月1日確認）</text></g>
</svg>
