<title id="title">償却方法｜計算の基礎と残高</title><desc id="desc">01 単純40%で5年間計算：費用合計922,240円、期末残高77,760円が残る。02 保証額の指定がある例：4年目の86,400＜保証108,000、改定取得価額216,000円へ切替。03 最後まで残高を確認：4年目108,000／5年目107,999、累計999,999／最終残高1円</desc>
