<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
<title id="title">簿記2級とFP2級：学ぶ内容と選ぶ順番</title><desc id="desc">試験範囲の違いを確認し、目的と受検資格から順番を決める。学習効果を保証する図ではない。</desc>
<g font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif" fill="#68816d">
<text x="380" y="35" font-size="20" text-anchor="middle" font-weight="700">簿記2級とFP2級：内容を比べて順番を選ぶ</text>
<text x="380" y="62" font-size="14" text-anchor="middle">共通の用語があっても、会計処理と税務のルールは同じではない</text>
<rect x="24" y="86" width="340" height="224" rx="12" fill="none" stroke="#7da05e" stroke-width="1.5"/>
<text x="42" y="116" font-size="18" text-anchor="start" font-weight="700">日商簿記2級</text>
<text x="42" y="151" font-size="14" text-anchor="start">会社の取引・決算を記録する</text>
<text x="42" y="180" font-size="14" text-anchor="start">商業簿記と工業簿記</text>
<text x="42" y="209" font-size="14" text-anchor="start">財務諸表・連結会計・原価計算</text>
<text x="42" y="238" font-size="14" text-anchor="start">受検資格に制限なし</text>
<text x="42" y="267" font-size="14" text-anchor="start">3級の基本を理解しているか確認</text>
<rect x="396" y="86" width="340" height="224" rx="12" fill="none" stroke="#7da05e" stroke-width="1.5"/>
<text x="414" y="116" font-size="18" text-anchor="start" font-weight="700">FP2級（日本FP協会）</text>
<text x="414" y="151" font-size="14" text-anchor="start">生活設計・保険・金融を学ぶ</text>
<text x="414" y="180" font-size="14" text-anchor="start">税金・不動産・相続等も対象</text>
<text x="414" y="209" font-size="14" text-anchor="start">学科と実技の両方に合格する</text>
<text x="414" y="238" font-size="14" text-anchor="start">受検資格に該当するかを先に確認</text>
<text x="414" y="267" font-size="14" text-anchor="start">税法・評価の条件を別途学ぶ</text>
<rect x="24" y="330" width="712" height="100" rx="12" fill="none" stroke="#7da05e" stroke-width="1.5"/>
<text x="380" y="359" font-size="18" text-anchor="middle" font-weight="700">使う目的 → 受検資格 → 次に解く問題</text>
<text x="380" y="389" font-size="14" text-anchor="middle">全員共通の順番・必要時間・就職順位は決めない</text>
<text x="380" y="414" font-size="12" text-anchor="middle">範囲：日本商工会議所・日本FP協会／選び方：編集部案</text>
</g></svg>
