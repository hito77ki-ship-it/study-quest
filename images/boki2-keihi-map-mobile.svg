<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">経費｜重なる集計を分けて確認</title><desc id="desc">01 費目としての間接経費：工場減価償却40,000＋電力15,000、間接経費55,000円。02 製造間接費には他の費目も入る：間接材料5,000＋間接労務20,000、55,000＋5,000＋20,000＝80,000円。03 直接経費と合計を検算：外注加工賃30,000円は直接経費、製造費用合計110,000円</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">経費｜重なる集計を分けて確認</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">01 費目としての間接経費</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">工場減価償却40,000＋電力15,000</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">間接経費55,000円</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">02 製造間接費には他の費目も入る</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">間接材料5,000＋間接労務20,000</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">55,000＋5,000＋20,000＝80,000円</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">03 直接経費と合計を検算</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">外注加工賃30,000円は直接経費</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">製造費用合計110,000円</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
