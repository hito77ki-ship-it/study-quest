<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">為替予約｜時期と損益の配分</title><desc id="desc">01  振当処理は条件を確認：2級では予約差額の期間配分をしない、1級の後予約例では直々・直先を分ける。02  自作例：直先差額6,000円：3か月配分：当期2,000・翌期4,000、買掛金を固定しても、費用の配分が残る。03  独立処理の期別検算：前期純損6,000＋翌期純損2,000、累計8,000円を、最終の円収支と照合</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">為替予約｜時期と損益の配分</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">01  振当処理は条件を確認</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">2級では予約差額の期間配分をしない</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">1級の後予約例では直々・直先を分ける</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">02  自作例：直先差額6,000円</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">3か月配分：当期2,000・翌期4,000</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">買掛金を固定しても、費用の配分が残る</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">03  独立処理の期別検算</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">前期純損6,000＋翌期純損2,000</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">累計8,000円を、最終の円収支と照合</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
