<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">カード販売｜計上時点を分ける</title><desc id="desc">01 販売時に費用計上：売上10,000−手数料300、債権9,700→入金9,700。02 入金時に費用計上：販売時の債権50,000、入金49,000＋費用1,000。03 残高を照合：費用を2回記録しない、回収後の債権はゼロ</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">カード販売｜計上時点を分ける</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">01 販売時に費用計上</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">売上10,000−手数料300</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">債権9,700→入金9,700</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">02 入金時に費用計上</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">販売時の債権50,000</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">入金49,000＋費用1,000</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">03 残高を照合</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">費用を2回記録しない</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">回収後の債権はゼロ</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
