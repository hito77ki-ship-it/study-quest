<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">TOEIC 900点｜合計と技能を分ける</title><desc id="desc">01  合計900点だけでC1にしない：架空例：L405＋R495＝900、ListeningのC1最低値には届かない。02  C1の最低値は技能別に確認：Listening 490 ／ Reading 455、合計945点でも内訳によっては未達。03  L&amp;Rから話す・書くを断定しない：990点を総合的なC2と説明しない、誤答の原因と使える時間から計画する</desc>
<rect width="390" height="660" rx="18" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">TOEIC 900点｜合計と技能を分ける</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="14" font-weight="700" fill="#B6E27C">01  合計900点だけでC1にしない</text>
<text x="34" y="165" font-size="13" fill="#F0F6ED">架空例：L405＋R495＝900</text>
<text x="34" y="193" font-size="13" fill="#F0F6ED">ListeningのC1最低値には届かない</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="14" font-weight="700" fill="#B6E27C">02  C1の最低値は技能別に確認</text>
<text x="34" y="339" font-size="13" fill="#F0F6ED">Listening 490 ／ Reading 455</text>
<text x="34" y="367" font-size="13" fill="#F0F6ED">合計945点でも内訳によっては未達</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="14" font-weight="700" fill="#B6E27C">03  L&amp;Rから話す・書くを断定しない</text>
<text x="34" y="513" font-size="13" fill="#F0F6ED">990点を総合的なC2と説明しない</text>
<text x="34" y="541" font-size="13" fill="#F0F6ED">誤答の原因と使える時間から計画する</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件の詳細・一次資料・自作例題の解答は本文へ</text></g></svg>
