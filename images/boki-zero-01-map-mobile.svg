<svg xmlns="http://www.w3.org/2000/svg" width="360" height="760" viewBox="0 0 360 760" role="img" aria-labelledby="title desc">
<title id="title">ノート1冊を仕入れて販売する仮定例</title><desc id="desc">売上総利益50円と、他の費用や税金を差し引いた最終利益を区別する。</desc>
<g font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif" fill="#68816d">
<text x="180" y="29" font-size="20" text-anchor="middle" font-weight="700">お店の取引と売上総利益</text>
<text x="180" y="57" font-size="14" text-anchor="middle">説明用の仮定：ノート1冊を全量販売</text>
<rect x="40" y="82" width="280" height="100" rx="12" fill="none" stroke="#7da05e" stroke-width="1.5"/>
<text x="180" y="121" font-size="20" text-anchor="middle" font-weight="700">仕入れ先</text>
<text x="180" y="154" font-size="16" text-anchor="middle">商品を仕入れる</text>
<rect x="40" y="220" width="280" height="100" rx="12" fill="none" stroke="#7da05e" stroke-width="1.5"/>
<text x="180" y="259" font-size="20" text-anchor="middle" font-weight="700">お店</text>
<text x="180" y="292" font-size="16" text-anchor="middle">仕入原価100円</text>
<rect x="40" y="358" width="280" height="100" rx="12" fill="none" stroke="#7da05e" stroke-width="1.5"/>
<text x="180" y="397" font-size="20" text-anchor="middle" font-weight="700">お客さん</text>
<text x="180" y="430" font-size="16" text-anchor="middle">売値150円</text>
<path d="M180 188v24m-7-9 7 9 7-9" fill="none" stroke="#7da05e" stroke-width="2"/>
<path d="M180 326v24m-7-9 7 9 7-9" fill="none" stroke="#7da05e" stroke-width="2"/>
<rect x="16" y="481" width="328" height="145" rx="12" fill="none" stroke="#7da05e" stroke-width="1.5"/>
<text x="180" y="512" font-size="17" text-anchor="middle" font-weight="700">売上高150円 − 売上原価100円</text>
<text x="180" y="545" font-size="21" text-anchor="middle" font-weight="700">＝ 売上総利益50円</text>
<text x="180" y="580" font-size="14" text-anchor="middle">家賃・人件費・税金などを引いた</text>
<text x="180" y="604" font-size="14" text-anchor="middle">最終利益とは区別する</text>
<text x="180" y="659" font-size="14" text-anchor="middle">売れ残った商品は在庫として扱う</text>
<text x="180" y="690" font-size="14" text-anchor="middle">簿記は取引を記録・計算・整理する</text>
<text x="180" y="721" font-size="14" text-anchor="middle">経営成績と財政状態を確かめる</text>
</g></svg>
