<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">演習記録｜同じ点でも戻る先は別</title><desc id="desc">01 同じ教材の減点8点：Aは科目の選択、Bは転記違い、点差だけでは原因を決めない。02 条件をそろえて試す：参照・初見・時間を記録、自力でできる段階を確かめる。03 次の練習を選ぶ：Aは取引の判断を復習、Bは科目と転記先を照合</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">演習記録｜同じ点でも戻る先は別</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">01 同じ教材の減点8点</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">Aは科目の選択、Bは転記違い</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">点差だけでは原因を決めない</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">02 条件をそろえて試す</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">参照・初見・時間を記録</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">自力でできる段階を確かめる</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">03 次の練習を選ぶ</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">Aは取引の判断を復習</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">Bは科目と転記先を照合</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
