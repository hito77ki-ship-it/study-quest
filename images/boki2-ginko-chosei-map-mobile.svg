<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">銀行調整｜計算と仕訳を分ける</title><desc id="desc">01  自作例の銀行側の計算：540,000−60,000＋20,000、調整後は500,000円。02  会社側と修正仕訳：470,000＋40,000−10,000、会社の調整後も500,000円。03  未渡でも、取得済みの備品は残る：預金を戻し、未払いの債務を計上、備品の取得そのものを取り消さない</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">銀行調整｜計算と仕訳を分ける</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="13" font-weight="700" fill="#B6E27C">01  自作例の銀行側の計算</text>
<text x="34" y="165" font-size="12" fill="#F0F6ED">540,000−60,000＋20,000</text>
<text x="34" y="193" font-size="12" fill="#F0F6ED">調整後は500,000円</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="13" font-weight="700" fill="#B6E27C">02  会社側と修正仕訳</text>
<text x="34" y="339" font-size="12" fill="#F0F6ED">470,000＋40,000−10,000</text>
<text x="34" y="367" font-size="12" fill="#F0F6ED">会社の調整後も500,000円</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="13" font-weight="700" fill="#B6E27C">03  未渡でも、取得済みの備品は残る</text>
<text x="34" y="513" font-size="12" fill="#F0F6ED">預金を戻し、未払いの債務を計上</text>
<text x="34" y="541" font-size="12" fill="#F0F6ED">備品の取得そのものを取り消さない</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
