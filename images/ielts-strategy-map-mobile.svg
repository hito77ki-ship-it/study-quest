<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 620" width="360" height="620" role="img" aria-labelledby="title desc">
<title id="title">IELTSの総合バンド計算と架空の技能別条件</title><desc id="desc">6.5、6.5、6.0、6.0の平均6.25は総合6.5。各技能6.0以上という架空の条件も満たす。</desc>
<style>text{font-family:'Noto Sans JP','Hiragino Sans',sans-serif}</style>
<rect x="0" y="0" width="360" height="620" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="180.0" y="28" font-size="12.5" fill="#1E293B" text-anchor="middle" font-weight="700">IELTS：総合と技能別条件の計算例</text>
<text x="180.0" y="50" font-size="10" fill="#1E293B" text-anchor="middle">架空例：出願先が各技能6.0以上を指定</text>
<rect x="16" y="70" width="328" height="74" rx="10" fill="#DBEAFE" stroke="#CBD5E1"/>
<text x="30" y="98" font-size="13" fill="#1E293B" text-anchor="start" font-weight="700">Listening</text>
<text x="324" y="98" font-size="14" fill="#1E293B" text-anchor="end" font-weight="700">6.5</text>
<text x="30" y="124" font-size="11" fill="#1E293B" text-anchor="start">仮の条件6.0以上を満たす</text>
<rect x="16" y="158" width="328" height="74" rx="10" fill="#EDE9FE" stroke="#CBD5E1"/>
<text x="30" y="186" font-size="13" fill="#1E293B" text-anchor="start" font-weight="700">Reading</text>
<text x="324" y="186" font-size="14" fill="#1E293B" text-anchor="end" font-weight="700">6.5</text>
<text x="30" y="212" font-size="11" fill="#1E293B" text-anchor="start">仮の条件6.0以上を満たす</text>
<rect x="16" y="246" width="328" height="74" rx="10" fill="#FFEDD5" stroke="#CBD5E1"/>
<text x="30" y="274" font-size="13" fill="#1E293B" text-anchor="start" font-weight="700">Writing</text>
<text x="324" y="274" font-size="14" fill="#1E293B" text-anchor="end" font-weight="700">6.0</text>
<text x="30" y="300" font-size="11" fill="#1E293B" text-anchor="start">仮の条件6.0以上を満たす</text>
<rect x="16" y="334" width="328" height="74" rx="10" fill="#FCE7F3" stroke="#CBD5E1"/>
<text x="30" y="362" font-size="13" fill="#1E293B" text-anchor="start" font-weight="700">Speaking</text>
<text x="324" y="362" font-size="14" fill="#1E293B" text-anchor="end" font-weight="700">6.0</text>
<text x="30" y="388" font-size="11" fill="#1E293B" text-anchor="start">仮の条件6.0以上を満たす</text>
<rect x="16" y="438" width="328" height="160" rx="10" fill="#FEF3C7" stroke="#CBD5E1"/>
<text x="180.0" y="466" font-size="12.5" fill="#1E293B" text-anchor="middle" font-weight="700">平均6.25 → 総合バンド6.5</text>
<text x="30" y="496" font-size="11" fill="#1E293B" text-anchor="start">図の4技能は仮の条件も満たします。</text>
<text x="30" y="521" font-size="11" fill="#1E293B" text-anchor="start">全受験者共通の合格点ではありません。</text>
<text x="30" y="546" font-size="11" fill="#1E293B" text-anchor="start">実際の指定は提出先ごとに確認します。</text>
<text x="30" y="579" font-size="9.5" fill="#1E293B" text-anchor="start">出典：IELTS／2026年10月31日確認</text>
</svg>
