<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="title desc"><title id="title">中小企業診断士の1次配点と科目免除</title><desc id="desc">各科目100点。免除科目は合否判定の対象外で、受験した科目の総点数と各科目の基準で判定する。</desc><style>text{font-family:"Noto Sans JP","Hiragino Sans",sans-serif}</style><rect x="0" y="0" width="1200" height="900" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="600.0" y="30" font-size="24" fill="#1E293B" text-anchor="middle" font-weight="700">中小企業診断士：1次試験の配点</text>
<text x="600.0" y="56" font-size="15" fill="#1E293B" text-anchor="middle">勉強時間のグラフではありません</text>
<rect x="60" y="80" width="1080" height="66" rx="10" fill="#DBEAFE" stroke="#CBD5E1"/>
<text x="84" y="107" font-size="20" fill="#1E293B" text-anchor="start" font-weight="700">経済学・経済政策</text>
<text x="1116" y="119" font-size="22" fill="#1E293B" text-anchor="end" font-weight="700">100点</text>
<rect x="60" y="166" width="1080" height="66" rx="10" fill="#DCFCE7" stroke="#CBD5E1"/>
<text x="84" y="193" font-size="20" fill="#1E293B" text-anchor="start" font-weight="700">財務・会計</text>
<text x="1116" y="205" font-size="22" fill="#1E293B" text-anchor="end" font-weight="700">100点</text>
<rect x="60" y="252" width="1080" height="66" rx="10" fill="#DBEAFE" stroke="#CBD5E1"/>
<text x="84" y="279" font-size="20" fill="#1E293B" text-anchor="start" font-weight="700">企業経営理論</text>
<text x="1116" y="291" font-size="22" fill="#1E293B" text-anchor="end" font-weight="700">100点</text>
<rect x="60" y="338" width="1080" height="66" rx="10" fill="#DCFCE7" stroke="#CBD5E1"/>
<text x="84" y="365" font-size="20" fill="#1E293B" text-anchor="start" font-weight="700">運営管理</text>
<text x="1116" y="377" font-size="22" fill="#1E293B" text-anchor="end" font-weight="700">100点</text>
<rect x="60" y="424" width="1080" height="66" rx="10" fill="#DBEAFE" stroke="#CBD5E1"/>
<text x="84" y="451" font-size="20" fill="#1E293B" text-anchor="start" font-weight="700">経営法務</text>
<text x="1116" y="463" font-size="22" fill="#1E293B" text-anchor="end" font-weight="700">100点</text>
<rect x="60" y="510" width="1080" height="66" rx="10" fill="#DCFCE7" stroke="#CBD5E1"/>
<text x="84" y="537" font-size="20" fill="#1E293B" text-anchor="start" font-weight="700">経営情報システム</text>
<text x="1116" y="549" font-size="22" fill="#1E293B" text-anchor="end" font-weight="700">100点</text>
<rect x="60" y="596" width="1080" height="66" rx="10" fill="#DBEAFE" stroke="#CBD5E1"/>
<text x="84" y="623" font-size="20" fill="#1E293B" text-anchor="start" font-weight="700">中小企業経営・中小企業政策</text>
<text x="1116" y="635" font-size="22" fill="#1E293B" text-anchor="end" font-weight="700">100点</text>
<rect x="60" y="700" width="1080" height="160" rx="10" fill="#FEF3C7" stroke="#CBD5E1"/>
<text x="600.0" y="734" font-size="20" fill="#1E293B" text-anchor="middle" font-weight="700">7科目受験時：合計700点の60%＝420点以上、かつ各科目40%以上が基準</text>
<text x="600.0" y="779" font-size="18" fill="#1E293B" text-anchor="middle">免除科目は合否判定の対象外。過去の点数を加算・固定する制度ではありません。</text>
<text x="600.0" y="818" font-size="16" fill="#1E293B" text-anchor="middle">受験した科目の総点数で判定。学習時間や優先順位は自分の演習記録から調整。</text>
<text x="600.0" y="884" font-size="12" fill="#1E293B" text-anchor="middle">出典：日本中小企業診断士協会連合会「令和8年度第1次試験案内」／2026年10月31日確認</text></svg>
