<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">有価証券｜分類と時点を確認</title><desc id="desc">01 売買目的505,000円を購入：期末時価530,000円、評価益25,000円。02 売却時の帳簿価額を見る：530,000円のまま520,000で売却、この条件なら売却損10,000円。03 債券と税効果は別条件：金利調整の取得差額を確認、純資産直入の税効果も区別</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">有価証券｜分類と時点を確認</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">01 売買目的505,000円を購入</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">期末時価530,000円</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">評価益25,000円</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">02 売却時の帳簿価額を見る</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">530,000円のまま520,000で売却</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">この条件なら売却損10,000円</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">03 債券と税効果は別条件</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">金利調整の取得差額を確認</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">純資産直入の税効果も区別</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
