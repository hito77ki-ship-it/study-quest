<title id="title">簿記1級｜講座と独学の判断シート</title><desc id="desc">01  受験回と教材の年度：配信開始日・演習の提供日・受講期限、受験する回に必要な教材がそろうか。02  質問の解消先を具体的に：対象・回数・返答方法を確認する、講義やAIだけで正解を保証しない。03  受講料と必要な予算を分ける：紙・追加教材・受験料・交通費も確認、教育訓練給付は条件付きの事後支給</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">簿記1級｜講座と独学の判断シート</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">01  受験回と教材の年度</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">配信開始日・演習の提供日・受講期限</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">受験する回に必要な教材がそろうか</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">02  質問の解消先を具体的に</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">対象・回数・返答方法を確認する</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">講義やAIだけで正解を保証しない</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">03  受講料と必要な予算を分ける</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">紙・追加教材・受験料・交通費も確認</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">教育訓練給付は条件付きの事後支給</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
