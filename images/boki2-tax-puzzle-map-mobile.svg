<title id="title">税金の精算｜費用・支払・残高を分ける</title><desc id="desc">01 法人税等の基本例：当期費用300,000円、中間120,000 ＋ 未払180,000。02 消費税・納付となる例：仮受500,000 − 仮払320,000、未払180,000円（調整なしの条件）。03 還付・過払いも確認：法人税等：120,000−100,000＝20,000、消費税：110,000−80,000＝30,000</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">税金の精算｜費用・支払・残高を分ける</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">01 法人税等の基本例</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">当期費用300,000円</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">中間120,000 ＋ 未払180,000</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">02 消費税・納付となる例</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">仮受500,000 − 仮払320,000</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">未払180,000円（調整なしの条件）</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">03 還付・過払いも確認</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">法人税等：120,000−100,000＝20,000</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">消費税：110,000−80,000＝30,000</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
