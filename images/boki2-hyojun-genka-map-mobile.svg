<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">標準原価｜同じ材料費を三つの額で検算</title><desc id="desc">01 標準数量300kgで計算：200円 × 300kg ＝ 60,000円、100個 × 標準3kg（仕掛品等なし）。02 実際数量320kgに置き換える：200円 × 320kg ＝ 64,000円、数量差4,000円の不利。03 実際価格210円へ置き換える：210円 × 320kg ＝ 67,200円、価格差3,200円、総額7,200円の不利</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">標準原価｜同じ材料費を三つの額で検算</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">01 標準数量300kgで計算</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">200円 × 300kg ＝ 60,000円</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">100個 × 標準3kg（仕掛品等なし）</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">02 実際数量320kgに置き換える</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">200円 × 320kg ＝ 64,000円</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">数量差4,000円の不利</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">03 実際価格210円へ置き換える</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">210円 × 320kg ＝ 67,200円</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">価格差3,200円、総額7,200円の不利</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
