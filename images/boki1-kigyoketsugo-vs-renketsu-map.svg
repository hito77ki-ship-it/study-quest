<title id="title">企業結合｜誰の帳簿かを先に確認</title><desc id="desc">01  自作例：株式100％を1,000万円で取得：B社の識別可能純資産は800万円、個別決算：子会社株式1,000を計上。02  取得日の連結決算：投資1,000と資本800を相殺する、差額200は連結ののれんへ。03  翌期以降も続けて確認：仮定：10年定額、1年の償却20万円、1年後の連結のれんは180万円</desc>
<rect x="10" y="10" width="740" height="75" rx="12" fill="#101B13"/><rect x="10" y="517" width="740" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="32" y="45" font-size="25" font-weight="700" fill="#B6E27C">企業結合｜誰の帳簿かを先に確認</text>
<text x="32" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="32" y="95" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="126" font-size="20" font-weight="700" fill="#B6E27C">01  自作例：株式100％を1,000万円で取得</text>
<text x="46" y="160" font-size="19" fill="#F0F6ED">B社の識別可能純資産は800万円</text>
<text x="46" y="187" font-size="19" fill="#F0F6ED">個別決算：子会社株式1,000を計上</text>
<rect x="32" y="233" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#B6E27C">02  取得日の連結決算</text>
<text x="46" y="298" font-size="19" fill="#F0F6ED">投資1,000と資本800を相殺する</text>
<text x="46" y="325" font-size="19" fill="#F0F6ED">差額200は連結ののれんへ</text>
<rect x="32" y="371" width="696" height="116" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="46" y="402" font-size="20" font-weight="700" fill="#B6E27C">03  翌期以降も続けて確認</text>
<text x="46" y="436" font-size="19" fill="#F0F6ED">仮定：10年定額、1年の償却20万円</text>
<text x="46" y="463" font-size="19" fill="#F0F6ED">1年後の連結のれんは180万円</text>
<text x="32" y="540" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
