<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-labelledby="title desc"><title id="title">税理士試験の5科目構成と選択条件</title><desc id="desc">会計学2科目と税法3科目。所得税法・法人税法の少なくとも一方を含み、消費税法と酒税法、住民税と事業税は各組の一方のみ。</desc><style>text{font-family:"Noto Sans JP","Hiragino Sans",sans-serif}</style><rect x="0" y="0" width="800" height="480" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="400.0" y="30" font-size="20" fill="#1E293B" text-anchor="middle" font-weight="700">税理士試験：会計学2科目＋税法3科目</text>
<text x="400.0" y="52" font-size="13" fill="#1E293B" text-anchor="middle">税法の組合せには条件があります</text>
<rect x="24" y="76" width="240" height="224" rx="10" fill="#DBEAFE" stroke="#CBD5E1"/>
<text x="44" y="112" font-size="18" fill="#1E293B" text-anchor="start" font-weight="700">会計学：必須2科目</text>
<text x="44" y="158" font-size="18" fill="#1E293B" text-anchor="start">簿記論</text>
<text x="44" y="198" font-size="18" fill="#1E293B" text-anchor="start">財務諸表論</text>
<text x="44" y="260" font-size="13" fill="#1E293B" text-anchor="start">1科目ずつの受験も可能</text>
<rect x="284" y="76" width="492" height="224" rx="10" fill="#EDE9FE" stroke="#CBD5E1"/>
<text x="304" y="112" font-size="18" fill="#1E293B" text-anchor="start" font-weight="700">税法：9科目から3科目</text>
<text x="304" y="150" font-size="13" fill="#1E293B" text-anchor="start">所得税法・法人税法・相続税法・消費税法・酒税法</text>
<text x="304" y="186" font-size="13" fill="#1E293B" text-anchor="start">国税徴収法・住民税・事業税・固定資産税</text>
<text x="304" y="222" font-size="13" fill="#1E293B" text-anchor="start">所得税法・法人税法の少なくとも一方を含む</text>
<text x="304" y="258" font-size="13" fill="#1E293B" text-anchor="start">消費税法と酒税法、住民税と事業税は各組で一方のみ</text>
<rect x="24" y="320" width="752" height="110" rx="10" fill="#DCFCE7" stroke="#CBD5E1"/>
<text x="400.0" y="350" font-size="14" fill="#1E293B" text-anchor="middle" font-weight="700">組合せ例：簿記論・財務諸表論・法人税法・消費税法・国税徴収法</text>
<text x="400.0" y="380" font-size="13" fill="#1E293B" text-anchor="middle">所得税法と法人税法は両方選ぶこともできます。</text>
<text x="400.0" y="408" font-size="12" fill="#1E293B" text-anchor="middle">科目合格の積み上げと受験資格は、国税庁の案内で確認します。</text>
<text x="400.0" y="461" font-size="11" fill="#1E293B" text-anchor="middle">出典：国税庁「試験概要」「受験申込みQ&amp;A」／2026年10月31日確認</text></svg>
