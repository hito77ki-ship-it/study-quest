<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">配賦差異｜符号と原因を分ける</title><desc id="desc">01 予定配賦105,000円：120,000÷400h×350h、実際112,000円と比較。02 不利差異7,000円：実際−配賦＝7,000、費用の加算先は指示を確認。03 原因は資料で確認：差異だけで無駄・責任を断定しない、予算と操業度の分解も条件付き</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">配賦差異｜符号と原因を分ける</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.03確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="15" font-weight="700" fill="#B6E27C">01 予定配賦105,000円</text>
<text x="34" y="165" font-size="14" fill="#F0F6ED">120,000÷400h×350h</text>
<text x="34" y="193" font-size="14" fill="#F0F6ED">実際112,000円と比較</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="15" font-weight="700" fill="#B6E27C">02 不利差異7,000円</text>
<text x="34" y="339" font-size="14" fill="#F0F6ED">実際−配賦＝7,000</text>
<text x="34" y="367" font-size="14" fill="#F0F6ED">費用の加算先は指示を確認</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="15" font-weight="700" fill="#B6E27C">03 原因は資料で確認</text>
<text x="34" y="513" font-size="14" fill="#F0F6ED">差異だけで無駄・責任を断定しない</text>
<text x="34" y="541" font-size="14" fill="#F0F6ED">予算と操業度の分解も条件付き</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
