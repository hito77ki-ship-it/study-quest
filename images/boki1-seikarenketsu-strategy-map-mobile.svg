<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">成果連結｜消去から翌期の実現へ</title><desc id="desc">01  自作例：売価1,000・原価800円：期末在庫600円はグループ内売価、売価利益率20％→消去利益120円。02  売り手が子会社の例：親会社80％：利益負担96円、非支配株主20％：利益負担24円。03  翌期にすべて外部へ売れたら：期首の修正を引き継ぎ、利益を実現、当期利益120円増：親会社96・非支配24</desc>
<rect x="10" y="10" width="370" height="75" rx="12" fill="#101B13"/><rect x="10" y="617" width="370" height="35" rx="8" fill="#101B13"/>
<g font-family="M PLUS 1, Hiragino Kaku Gothic ProN, sans-serif"><text x="20" y="45" font-size="17" font-weight="700" fill="#B6E27C">成果連結｜消去から翌期の実現へ</text>
<text x="20" y="73" font-size="12" fill="#C7D3C7">Study Quest 編集部作成｜2026.11.02確認</text>
<rect x="20" y="100" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="131" font-size="13" font-weight="700" fill="#B6E27C">01  自作例：売価1,000・原価800円</text>
<text x="34" y="165" font-size="12" fill="#F0F6ED">期末在庫600円はグループ内売価</text>
<text x="34" y="193" font-size="12" fill="#F0F6ED">売価利益率20％→消去利益120円</text>
<rect x="20" y="274" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="305" font-size="13" font-weight="700" fill="#B6E27C">02  売り手が子会社の例</text>
<text x="34" y="339" font-size="12" fill="#F0F6ED">親会社80％：利益負担96円</text>
<text x="34" y="367" font-size="12" fill="#F0F6ED">非支配株主20％：利益負担24円</text>
<rect x="20" y="448" width="350" height="150" rx="12" fill="#1E3023" stroke="#507448"/>
<text x="34" y="479" font-size="13" font-weight="700" fill="#B6E27C">03  翌期にすべて外部へ売れたら</text>
<text x="34" y="513" font-size="12" fill="#F0F6ED">期首の修正を引き継ぎ、利益を実現</text>
<text x="34" y="541" font-size="12" fill="#F0F6ED">当期利益120円増：親会社96・非支配24</text>
<text x="20" y="640" font-size="11" fill="#C7D3C7">条件・単位・一次資料と例題の解答は本文へ</text></g></svg>
